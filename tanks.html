<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="theme-color" content="#060a10">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script defer src="/_vercel/insights/script.js"></script>
<meta name="description" content="BT 8BIT — База танків. Характеристики, тіри, фракції.">
<link rel="icon" type="image/x-icon" href="favicon.ico">
<title>BT 8BIT — База техніки</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#060a10;--surf:#0d1520;--card:#111e2e;--border:#1a3050;
  --gold:#e8bc38;--steel:#8eb0cc;--text:#d4cdb8;--dim:#6a7a8a;
  --green:#4aaa5a;--red:#aa2020;
  --east:#cc2222;--west:#2244cc;--north:#888888;--euro:#4488cc;--asian:#cc44aa;
  --assault:#e84040;--support:#4488e8;--recon:#44cc66;--arty:#e88038;--medium:#9944cc;
  --px:'Press Start 2P',monospace;--rb:system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--rb);min-height:100vh;}

/* NAV */
nav{position:sticky;top:0;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:0 40px;height:60px;background:rgba(6,10,16,0.97);backdrop-filter:blur(12px);border-bottom:1px solid var(--border);}
.nav-logo{display:flex;align-items:center;gap:10px;text-decoration:none;}
.nav-logo-text{font-family:var(--px);font-size:13px;color:var(--gold);}
.nav-back{padding:8px 16px;border:1px solid var(--border);color:var(--dim);font-size:12px;text-decoration:none;transition:all .2s;}
.nav-back:hover{border-color:var(--gold);color:var(--gold);}

/* HERO */
.tanks-hero{text-align:center;padding:48px 40px 32px;border-bottom:1px solid var(--border);background:radial-gradient(ellipse 60% 80% at 50% 0%,rgba(30,60,100,.2),transparent 70%);}
.tanks-eye{font-family:var(--px);font-size:8px;color:var(--gold);letter-spacing:3px;display:block;margin-bottom:12px;}
.tanks-title{font-family:var(--px);font-size:clamp(14px,3vw,22px);color:#fff;margin-bottom:8px;}
.tanks-desc{font-size:13px;color:var(--dim);max-width:500px;margin:0 auto;}

/* FILTERS */
.filters{padding:20px 40px;background:var(--surf);border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:16px;align-items:center;}
.filter-group{display:flex;flex-wrap:wrap;gap:6px;align-items:center;}
.filter-label{font-family:var(--px);font-size:7px;color:var(--dim);letter-spacing:2px;margin-right:4px;white-space:nowrap;}
.ftag{padding:5px 12px;background:transparent;border:1px solid var(--border);color:var(--dim);font-size:11px;cursor:pointer;transition:all .15s;}
.ftag:hover{border-color:var(--steel);color:var(--text);}
.ftag.active{border-color:var(--gold);color:var(--gold);background:rgba(232,188,56,0.08);}
.ftag.faction-east{--fc:var(--east);}
.ftag.faction-west{--fc:var(--west);}
.ftag.faction-north{--fc:var(--north);}
.ftag.faction-euro{--fc:var(--euro);}
.ftag.faction-asian{--fc:var(--asian);}
.ftag.faction-east.active,.ftag.faction-west.active,.ftag.faction-north.active,
.ftag.faction-euro.active,.ftag.faction-asian.active{border-color:var(--fc);color:var(--fc);background:rgba(0,0,0,0.2);}
.filter-sep{width:1px;height:32px;background:var(--border);}
.search-input{padding:7px 14px;background:var(--card);border:1px solid var(--border);color:var(--text);font-size:12px;outline:none;min-width:180px;margin-left:auto;}
.search-input:focus{border-color:var(--gold);}
.search-input::placeholder{color:var(--dim);}

/* GRID */
.tanks-wrap{max-width:1280px;margin:0 auto;padding:24px 40px;}
.tanks-stats{display:flex;gap:16px;margin-bottom:20px;font-size:12px;color:var(--dim);align-items:center;}
.tanks-stats span{color:var(--gold);font-family:var(--px);font-size:11px;}
.tanks-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:12px;}

/* TANK CARD */
.tank-card{background:var(--card);border:1px solid var(--border);cursor:pointer;transition:all .2s;position:relative;overflow:hidden;}
.tank-card:hover{border-color:var(--gold);transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,0.4);}
.tank-card.coming-soon{opacity:.6;}
.tank-card-faction-bar{height:3px;width:100%;}
.tank-card-img{height:140px;display:flex;align-items:center;justify-content:center;background:var(--surf);font-size:72px;position:relative;}
.tank-card-tier{position:absolute;top:8px;left:8px;font-family:var(--px);font-size:9px;background:rgba(6,10,16,0.9);border:1px solid var(--border);padding:4px 8px;color:var(--gold);}
.tank-card-class{position:absolute;top:8px;right:8px;font-size:10px;padding:4px 8px;border:1px solid;font-family:var(--px);}
.tank-card-soon{position:absolute;bottom:8px;right:8px;font-family:var(--px);font-size:7px;background:rgba(232,188,56,0.15);border:1px solid var(--gold);color:var(--gold);padding:3px 8px;}
.tank-card-body{padding:14px 16px;}
.tank-card-name{font-family:var(--px);font-size:11px;color:#fff;margin-bottom:4px;}
.tank-card-faction{font-size:11px;color:var(--dim);margin-bottom:12px;}
.tank-stats{display:grid;grid-template-columns:1fr 1fr;gap:6px;}
.tank-stat{display:flex;align-items:center;gap:6px;font-size:11px;}
.tank-stat-icon{width:16px;text-align:center;font-size:12px;}
.tank-stat-label{color:var(--dim);flex:1;}
.tank-stat-val{font-family:var(--px);font-size:9px;color:var(--text);}
.tank-stat-bar{height:3px;background:var(--border);margin-top:2px;border-radius:2px;overflow:hidden;}
.tank-stat-fill{height:100%;border-radius:2px;transition:width .6s ease;}

/* MODAL */
#tank-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.92);z-index:500;align-items:flex-start;justify-content:center;backdrop-filter:blur(4px);overflow-y:auto;padding:20px 0;}
.modal-box{background:var(--card);border:1px solid var(--border);width:min(680px,96vw);margin:auto;}
.modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.modal-title{font-family:var(--px);font-size:12px;color:var(--gold);}
.modal-close{background:transparent;border:1px solid var(--border);color:var(--dim);width:32px;height:32px;font-size:16px;cursor:pointer;transition:all .2s;}
.modal-close:hover{border-color:var(--gold);color:var(--gold);}
.modal-body{padding:24px;}
.modal-top{display:flex;gap:24px;margin-bottom:24px;flex-wrap:wrap;}
.modal-img{width:180px;height:140px;background:var(--surf);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:80px;flex-shrink:0;}
.modal-info{flex:1;min-width:200px;}
.modal-name{font-family:var(--px);font-size:14px;color:#fff;margin-bottom:6px;}
.modal-meta{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
.modal-badge{font-family:var(--px);font-size:7px;padding:4px 10px;border:1px solid;}
.modal-desc{font-size:13px;color:var(--dim);line-height:1.8;margin-bottom:12px;}
.modal-role{font-size:12px;color:var(--steel);font-style:italic;line-height:1.7;}
.modal-stats-title{font-family:var(--px);font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:14px;}
.modal-stats-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
.modal-stat-row{display:flex;flex-direction:column;gap:4px;}
.modal-stat-header{display:flex;justify-content:space-between;font-size:12px;}
.modal-stat-name{color:var(--dim);}
.modal-stat-value{font-family:var(--px);font-size:10px;color:var(--text);}
.modal-stat-track{height:6px;background:var(--border);border-radius:3px;overflow:hidden;}
.modal-stat-fill{height:100%;border-radius:3px;transition:width .8s ease;}
.modal-perks{margin-top:20px;padding-top:20px;border-top:1px solid var(--border);}
.modal-perks-title{font-family:var(--px);font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:12px;}
.perk-list{display:flex;flex-direction:column;gap:8px;}
.perk-row{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;background:var(--surf);border:1px solid var(--border);}
.perk-icon{font-size:18px;flex-shrink:0;}
.perk-name{font-size:12px;color:#fff;margin-bottom:2px;}
.perk-desc{font-size:11px;color:var(--dim);line-height:1.5;}

/* EMPTY */
.empty-state{text-align:center;padding:80px 20px;color:var(--dim);}
.empty-icon{font-size:48px;display:block;margin-bottom:16px;}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:700;padding:12px 18px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--text);transform:translateY(80px);opacity:0;transition:all .3s;}
#toast.show{transform:translateY(0);opacity:1;}

@media(max-width:768px){
  nav{padding:0 16px;}
  .tanks-hero{padding:32px 16px 24px;}
  .filters{padding:14px 16px;gap:10px;}
  .tanks-wrap{padding:16px;}
  .tanks-grid{grid-template-columns:1fr 1fr;}
  .modal-top{flex-direction:column;}
  .modal-img{width:100%;height:120px;}
  .modal-stats-grid{grid-template-columns:1fr;}
  .filter-sep{display:none;}
  .search-input{width:100%;margin-left:0;}
}
@media(max-width:480px){
  .tanks-grid{grid-template-columns:1fr;}
  .filter-group{gap:4px;}
  .ftag{font-size:10px;padding:4px 8px;}
}
</style>
</head>

<div id="toast"></div>

<nav>

    <button class="ftag" data-filter="tier" data-val="7" onclick="setFilter('tier','7')">VII</button>
    <button class="ftag" data-filter="tier" data-val="8" onclick="setFilter('tier','8')">VIII</button>
    <button class="ftag" data-filter="tier" data-val="9" onclick="setFilter('tier','9')">IX</button>
    <button class="ftag" data-filter="tier" data-val="10" onclick="setFilter('tier','10')">X</button>
  </div>

  <input class="search-input" id="search-input" type="text" placeholder="🔍 Пошук танку..." oninput="renderTanks()">
</div>

<div class="tanks-wrap">
  <div class="tanks-stats">

<!-- MODAL -->
<div id="tank-modal" onclick="if(event.target===this)closeModal()">

        <div class="perk-list" id="m-perks"></div>
      </div>
    </div>
  </div>
</div>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getFirestore, collection, getDocs, doc, getDoc }
  from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyC3VbYFS0AfyY9TquptvezYu66w-djUkiw",
  authDomain:"tanksbattles3d.firebaseapp.com",
  projectId:"tanksbattles3d",
  storageBucket:"tanksbattles3d.firebasestorage.app",
  messagingSenderId:"626439210789",
  appId:"1:626439210789:web:3445ea49a9196e08e27ccc"
});
const db = getFirestore(app);

// Завантажуємо з Firestore, fallback на вбудовані дані
async function loadTanks() {
  try {
    const snap = await getDocs(collection(db, 'tanks_db'));
    if (!snap.empty) {
      window.TANKS = snap.docs.map(d => ({ id: d.id, ...d.data() }));
      renderTanks();
      return;
    }
  } catch(e) {}
  // Fallback — вбудовані дані
  window.TANKS = DEFAULT_TANKS;
  renderTanks();
}

loadTanks();
</script>

// ── ФІЛЬТРИ ───────────────────────────────────────────────────
let activeFilters = { faction:'all', class:'all', tier:'all' };

window.setFilter = function(type, val) {
  activeFilters[type] = val;
  document.querySelectorAll(`.ftag[data-filter="${type}"]`).forEach(b => {
    b.classList.toggle('active', b.dataset.val === val);
  });
  renderTanks();
};

// ── РЕНДЕР ────────────────────────────────────────────────────
window.renderTanks = function() {
  const tanks = window.TANKS || DEFAULT_TANKS;
  const search = document.getElementById('search-input')?.value.toLowerCase() || '';
  const filtered = tanks.filter(t => {
    if (activeFilters.faction !== 'all' && t.faction !== activeFilters.faction) return false;
    if (activeFilters.class  !== 'all' && t.tankClass !== activeFilters.class) return false;
    if (activeFilters.tier   !== 'all' && String(t.tier) !== activeFilters.tier) return false;
    if (search && !t.name.toLowerCase().includes(search) && !t.nation?.toLowerCase().includes(search)) return false;
    return true;
  });

  document.getElementById('total-count').textContent = tanks.length;
  document.getElementById('shown-count').textContent  = filtered.length;

  const grid = document.getElementById('tanks-grid');
  if (!filtered.length) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <span class="empty-icon">🔍</span>
      <div>Танків не знайдено</div>
    </div>`;
    return;
  }

  grid.innerHTML = filtered.map(t => {
    const fc = FACTION_COLORS[t.faction] || '#888';
    const cc = CLASS_COLORS[t.tankClass] || '#888';
    const cl = CLASS_LABELS[t.tankClass] || t.tankClass;
    const fl = FACTION_LABELS[t.faction] || t.faction;
    const st = t.stats || {};

    return `<div class="tank-card ${t.comingSoon?'coming-soon':''}" onclick="openModal('${t.id}')">
      <div class="tank-card-faction-bar" style="background:${fc}"></div>
      <div class="tank-card-img">
        <span style="filter:drop-shadow(0 0 16px ${fc}66)">${t.emoji||'🚀'}</span>
        <div class="tank-card-tier">Тір ${TIER_ROMAN[t.tier]||t.tier}</div>
        <div class="tank-card-class" style="color:${cc};border-color:${cc}55;background:rgba(0,0,0,0.7)">${cl}</div>
        ${t.comingSoon?'<div class="tank-card-soon">СКОРО</div>':''}
      </div>
      <div class="tank-card-body">
        <div class="tank-card-name">${t.name}</div>
        <div class="tank-card-faction" style="color:${fc}">${fl}${t.nation?' · '+t.nation:''}</div>
        <div class="tank-stats">
          ${statBar('❤️','HP',st.hp,fc)}
          ${statBar('🔫','Урон',st.damage,cc)}
          ${statBar('🛡️','Броня',st.armor,'#8eb0cc')}
          ${statBar('💨','Швидкість',st.speed,'#4aaa5a')}
        </div>
      </div>
    </div>`;
  }).join('');
};

function statBar(icon, label, val, color) {
  const v = val || 0;
  return `<div class="tank-stat">
    <span class="tank-stat-icon">${icon}</span>
    <div style="flex:1">
      <div style="display:flex;justify-content:space-between;font-size:10px;color:var(--dim);margin-bottom:2px">
        <span>${label}</span><span style="color:var(--text);font-family:var(--px);font-size:8px">${v}</span>
      </div>
      <div class="tank-stat-bar"><div class="tank-stat-fill" style="width:${v}%;background:${color}"></div></div>
    </div>
  </div>`;
}

// ── МОДАЛКА ───────────────────────────────────────────────────
window.openModal = function(id) {
  const tanks = window.TANKS || DEFAULT_TANKS;
  const t = tanks.find(t => t.id === id);
  if (!t) return;

  const fc = FACTION_COLORS[t.faction] || '#888';
  const cc = CLASS_COLORS[t.tankClass] || '#888';
  const st = t.stats || {};

  document.getElementById('m-title').textContent = t.name;
  document.getElementById('m-img').innerHTML = `<span style="font-size:80px;filter:drop-shadow(0 0 20px ${fc}88)">${t.emoji||'🚀'}</span>`;
  document.getElementById('m-name').textContent = t.name;
  document.getElementById('m-desc').textContent = t.desc || '';
  document.getElementById('m-role').textContent = t.role ? '💡 ' + t.role : '';

  document.getElementById('m-meta').innerHTML = `
    <span class="modal-badge" style="color:${fc};border-color:${fc}55">${FACTION_LABELS[t.faction]||t.faction}</span>
    <span class="modal-badge" style="color:${cc};border-color:${cc}55">${CLASS_LABELS[t.tankClass]||t.tankClass}</span>
    <span class="modal-badge" style="color:var(--gold);border-color:rgba(232,188,56,0.4)">Тір ${TIER_ROMAN[t.tier]||t.tier}</span>
    ${t.nation?`<span class="modal-badge" style="color:var(--dim);border-color:var(--border)">${t.nation}</span>`:''}
    ${t.comingSoon?`<span class="modal-badge" style="color:var(--gold);border-color:var(--gold)">⏳ СКОРО</span>`:''}
  `;

  const statsData = [
    {label:'❤️ HP',          val:st.hp,     color:'#e84040'},
    {label:'🔫 Урон',        val:st.damage,  color:cc},
    {label:'🛡️ Броня',      val:st.armor,   color:'#8eb0cc'},
    {label:'💨 Швидкість',   val:st.speed,   color:'#4aaa5a'},
    {label:'👁️ Огляд',      val:st.view,    color:'#e8bc38'},
    {label:'👻 Маскування',  val:st.masking, color:'#a070cc'},
  ];
  document.getElementById('m-stats').innerHTML = statsData.map(s => `
    <div class="modal-stat-row">
      <div class="modal-stat-header">
        <span class="modal-stat-name">${s.label}</span>
        <span class="modal-stat-value">${s.val||0}/100</span>
      </div>
      <div class="modal-stat-track">
        <div class="modal-stat-fill" style="width:${s.val||0}%;background:${s.color}"></div>
      </div>
    </div>`).join('');

  const perks = t.perks || [];
  const perksWrap = document.getElementById('m-perks-wrap');
  if (perks.length) {
    perksWrap.style.display = 'block';
    document.getElementById('m-perks').innerHTML = perks.map(p => `
      <div class="perk-row">
        <div class="perk-icon">${p.icon||'⭐'}</div>
        <div><div class="perk-name">${p.name}</div><div class="perk-desc">${p.desc}</div></div>
      </div>`).join('');
  } else { perksWrap.style.display = 'none'; }

  document.getElementById('tank-modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
};

window.closeModal = function() {
  document.getElementById('tank-modal').style.display = 'none';
  document.body.style.overflow = '';
};
document.addEventListener('keydown', e => { if (e.key==='Escape') closeModal(); });

// Ініціалізація якщо module не завантажився
if (!window.TANKS) { window.TANKS = DEFAULT_TANKS; renderTanks(); }
</script>
</body>
</html>
