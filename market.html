// ── FIREBASE MARKETPLACE ──────────────────────────────────────
let allListings = [];
let activeFilters = { type:'all', currency:'all', rarity:'all', sort:'newest', search:'' };
let isLoading = false;

async function loadMarketplace() {
  if (isLoading) return;
  isLoading = true;
  const grid = document.getElementById('market-grid');
  grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1"><div style="font-size:24px;margin-bottom:12px">⏳</div>Завантаження лотів...</div>';

  try {
    // Базовий запит — тільки активні лоти
    const q = query(
      collection(db, 'marketplace'),
      where('status', '==', 'active'),
      orderBy('createdAt', 'desc'),
      limit(100)
    );
    const snap = await getDocs(q);

    if (snap.empty) {
      // Показуємо заглушку якщо Firebase порожній
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
        <div style="font-size:36px;margin-bottom:16px">🏪</div>
        <div style="font-size:14px;color:var(--text);margin-bottom:8px">Ринок поки порожній</div>
        <div style="font-size:12px;color:var(--dim)">Будь першим хто виставить товар!</div>
        <a href="profile.html" style="display:inline-block;margin-top:16px;padding:10px 20px;background:var(--gold);color:var(--bg);text-decoration:none;font-family:var(--px);font-size:9px">Відкрити інвентар →</a>
      </div>`;
      document.getElementById('result-count').textContent = '0 лотів';

      // Оновити статистику шапки
      setText('ms-listings', '0');
      setText('ms-today', '0');
      setText('ms-sellers', '0');
      return;
    }

    allListings = snap.docs.map(d => ({ id: d.id, ...d.data() }));

    // Оновити статистику шапки
    const today = new Date().toISOString().slice(0,10);
    const todayCount = allListings.filter(l => {
      const d = l.createdAt?.toDate ? l.createdAt.toDate().toISOString().slice(0,10) : '';
      return d === today;
    }).length;
    const sellers = new Set(allListings.map(l => l.sellerId)).size;

    setText('ms-listings', allListings.length.toLocaleString());
    setText('ms-today', todayCount.toLocaleString());
    setText('ms-sellers', sellers.toLocaleString());

    renderGrid();
  } catch(e) {
    console.error('Market load error:', e);
    // Якщо індекс ще будується — спрощений запит
    if (e.code === 'failed-precondition' || e.message.includes('index')) {
      try {
        const q2 = query(collection(db,'marketplace'), where('status','==','active'), limit(50));
        const snap2 = await getDocs(q2);
        allListings = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
        renderGrid();
      } catch(e2) {
        grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">⚠️ Індекси будуються. Зачекай кілька хвилин і оновни сторінку.</div>`;
      }
    } else {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">⚠️ Помилка завантаження: ${e.message}</div>`;
    }
  } finally {
    isLoading = false;
  }
}

function setText(id, val) {
  const el = document.getElementById(id);
  if (el) el.textContent = val;
}

function getFiltered() {
  return allListings.filter(item => {
    const type = item.itemType || item.type || '';
    const curr = item.currency || '';
    const rar  = item.itemRarity || item.rarity || '';
    const name = (item.itemName || item.name || '').toLowerCase();
    const seller = (item.sellerNick || item.seller || '').toLowerCase();

    if (activeFilters.type !== 'all' && type !== activeFilters.type) return false;
    if (activeFilters.currency !== 'all' && curr !== activeFilters.currency) return false;
    if (activeFilters.rarity !== 'all' && rar !== activeFilters.rarity) return false;
    if (activeFilters.search) {
      const s = activeFilters.search.toLowerCase();
      if (!name.includes(s) && !seller.includes(s)) return false;
    }
    return true;
  }).sort((a,b) => {
    if (activeFilters.sort === 'price_asc')  return (a.price||0) - (b.price||0);
    if (activeFilters.sort === 'price_desc') return (b.price||0) - (a.price||0);
    if (activeFilters.sort === 'popular')    return (b.views||0) - (a.views||0);
    // newest — по createdAt
    const ta = a.createdAt?.toDate ? a.createdAt.toDate() : new Date(0);
    const tb = b.createdAt?.toDate ? b.createdAt.toDate() : new Date(0);
    return tb - ta;
  });
}

function renderCard(item) {
  const type   = item.itemType || item.type || 'tank';
  const name   = item.itemName || item.name || '—';
  const nation = item.itemNation || item.nation || '';
  const tier   = item.itemTier || item.tier || 0;
  const rarity = item.itemRarity || item.rarity || 'common';
  const seller = item.sellerNick || item.seller || '—';
  const isRent = item.isRent || type === 'rent';
  const rentDays = item.rentDays || 0;

  const rc = RARITY_COLOR[rarity] || '#888';
  const rl = RARITY_LABEL[rarity] || rarity;
  const ci = CURRENCY_ICON[item.currency] || '💰';
  const views = item.views || 0;

  const typeTag = isRent
    ? `<span class="tag-rent">ОРЕНДА · ${rentDays}д</span>`
    : type === 'camo'
    ? `<span class="tag-camo">КАМУФЛЯЖ</span>`
    : `<span class="tag-tank">ТАНК</span>`;

  const altPrice = (item.currency2 && item.price2)
    ? `<div class="card-alt-price">${CURRENCY_ICON[item.currency2]||'💰'} ${Number(item.price2).toLocaleString()} ${CURRENCY_LABEL[item.currency2]||''}</div>` : '';

  return `<div class="market-card" onclick="openItem('${item.id}')">
    <div class="card-img" style="border-color:${rc}20">
      ${getTankSVG(item)}
      <div class="card-rarity" style="color:${rc}">${rl}</div>
      ${typeTag}
      ${!isRent ? `<div class="card-views">👁 ${views}</div>` : ''}
    </div>
    <div class="card-body">
      <div class="card-name">${nation ? nation+' ' : ''}${name}</div>
      ${tier ? `<div class="card-tier">Рівень ${tier}</div>` : ''}
      <div class="card-seller">Продавець: <span>${seller}</span></div>
      <div class="card-price-row">
        <div class="card-price">${ci} ${Number(item.price||0).toLocaleString()} <span>${CURRENCY_LABEL[item.currency]||''}</span></div>
        ${altPrice}
      </div>
      <button class="card-buy-btn" onclick="event.stopPropagation();buyItem('${item.id}')">
        ${isRent ? 'Орендувати' : 'Купити'}
      </button>
    </div>
  </div>`;
}

function renderGrid() {
  const items = getFiltered();
  const grid  = document.getElementById('market-grid');
  const count = document.getElementById('result-count');
  if (count) count.textContent = items.length + ' лотів';
  if (!items.length) {
    grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">😔 Нічого не знайдено за вашими фільтрами</div>';
    return;
  }
  grid.innerHTML = items.map(renderCard).join('');
}

window.applyFilter = function(key, val) {
  activeFilters[key] = val;
  document.querySelectorAll(`.filter-btn[data-key="${key}"]`).forEach(b => {
    b.classList.toggle('active', b.dataset.val === val);
  });
  // Для сортування — змінюємо select
  if (key === 'sort') {
    const sel = document.querySelector('.sort-select');
    if (sel) sel.value = val;
  }
  renderGrid();
};

window.applySearch = function() {
  activeFilters.search = document.getElementById('search-box').value.trim();
  renderGrid();
};

  const type   = item.itemType || item.type || 'tank';
  const name   = item.itemName || item.name || '—';

  const ci = CURRENCY_ICON[item.currency] || '💰';

    <div class="item-modal-grid">
      <div class="item-modal-img" style="border-color:${rc}30">
        ${getTankSVG(item)}
        <div style="text-align:center;margin-top:8px;font-size:11px;color:${rc}">${rl}</div>
      </div>
      <div class="item-modal-info">
        <div class="item-modal-name">${nation ? nation+' ' : ''}${name}</div>
        ${tier ? `<div class="item-modal-meta">Рівень ${tier}</div>` : ''}
        <div class="item-modal-seller">Продавець: <span style="color:var(--gold)">${seller}</span></div>
        <div class="item-modal-stats">
          <div class="modal-stat"><span>Тип</span><b>${TYPE_LABEL[type]||type}</b></div>
          <div class="modal-stat"><span>Переглядів</span><b>${views}</b></div>
          ${isRent ? `<div class="modal-stat"><span>Термін</span><b>${item.rentDays||0} днів</b></div>` : ''}
          <div class="modal-stat"><span>Рідкість</span><b style="color:${rc}">${rl}</b></div>
          <div class="modal-stat"><span>Додано</span><b>${created}</b></div>
        </div>
        <div class="item-modal-price">${ci} ${Number(item.price||0).toLocaleString()} ${CURRENCY_LABEL[item.currency]||''}</div>
        ${item.currency2 ? `<div style="font-size:12px;color:var(--dim);margin-bottom:12px">або ${CURRENCY_ICON[item.currency2]||''} ${Number(item.price2||0).toLocaleString()} ${CURRENCY_LABEL[item.currency2]||''}</div>` : ''}

          <button class="modal-buy-btn" onclick="buyItem('${id}');closeModal()">${isRent ? 'Орендувати' : 'Купити зараз'}</button>

        </div>
      </div>
    </div>`;

  // Increment views
  updateDoc(doc(db,'marketplace',id), { views: increment(1) }).catch(()=>{});

  document.getElementById('item-modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
};

window.closeModal = function() {
  document.getElementById('item-modal').style.display = 'none';
  document.body.style.overflow = '';
};

window.buyItem = async function(id) {
  if (!window._currentUser) {
    showToast('Спочатку увійди в кабінет!','error');
    setTimeout(() => { window.location.href = 'profile.html'; }, 1500);
    return;
  }
  const item = allListings.find(d => d.id === id);
  if (!item) return;

  const name = item.itemName || item.name || '—';

  try {
    // Позначити як продано
    await updateDoc(doc(db,'marketplace',id), {
      status: 'sold',
      buyerId: window._currentUser.uid,
      soldAt: new Date()
    });
    // Оновити список
    allListings = allListings.filter(l => l.id !== id);
    showToast(`✅ Куплено! ${name} додано в інвентар.`, '');
    renderGrid();
  } catch(e) {
    showToast('Помилка покупки: ' + e.message, 'error');
  }
};

function showToast(msg, type) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'show' + (type ? ' ' + type : '');
  setTimeout(() => t.className = '', 3000);
}
window.showToast = showToast;

document.addEventListener('DOMContentLoaded', () => {
  loadMarketplace();
});
</script>

<style>
:root{--bg:#060a10;--surf:#0d1520;--card:#111e2e;--border:#1a3050;--gold:#e8bc38;--gold2:#c49a20;--steel:#8eb0cc;--text:#d4cdb8;--dim:#6a7a8a;--green:#4aaa5a;--px:'Press Start 2P',monospace;--rb:system-ui,sans-serif;}
*{margin:0;padding:0;box-sizing:border-box;}
body{background:var(--bg);color:var(--text);font-family:var(--rb);min-height:100vh;}
input,button,select{font-family:var(--rb);}

.nav-links{display:flex;gap:20px;list-style:none;}

.nav-right{display:flex;gap:10px;align-items:center;}
.btn-auth{padding:7px 16px;border:1px solid var(--gold);background:transparent;color:var(--gold);font-size:10px;font-family:var(--px);cursor:pointer;text-decoration:none;transition:all .2s;}
.btn-auth:hover{background:var(--gold);color:var(--bg);}
.btn-sell{padding:7px 16px;border:1px solid var(--green);background:rgba(74,170,90,0.1);color:var(--green);font-size:10px;font-family:var(--px);cursor:pointer;text-decoration:none;transition:all .2s;}
.btn-sell:hover{background:var(--green);color:#fff;}

/* HERO MARKET */
.market-hero{background:var(--surf);border-bottom:1px solid var(--border);padding:32px 40px 24px;}
.market-hero-inner{max-width:1200px;margin:0 auto;}
.market-title{font-family:var(--px);font-size:clamp(16px,3vw,28px);color:#fff;margin-bottom:8px;}

.ms-val{font-family:var(--px);font-size:18px;color:var(--gold);display:block;margin-bottom:4px;}
.ms-lbl{font-size:10px;color:var(--dim);}

/* LAYOUT */
.market-layout{max-width:1200px;margin:0 auto;padding:24px 40px;display:grid;grid-template-columns:240px 1fr;gap:20px;align-items:start;}

/* FILTERS SIDEBAR */
.filters{background:var(--card);border:1px solid var(--border);padding:20px;}
.filters-title{font-family:var(--px);font-size:9px;color:var(--gold);letter-spacing:2px;margin-bottom:16px;}
.filter-section{margin-bottom:20px;padding-bottom:20px;border-bottom:1px solid rgba(26,48,80,0.5);}
.filter-section:last-child{border-bottom:none;margin-bottom:0;padding-bottom:0;}
.filter-label{font-size:11px;color:var(--dim);margin-bottom:10px;letter-spacing:1px;text-transform:uppercase;}
.filter-btns{display:flex;flex-direction:column;gap:4px;}
.filter-btn{padding:8px 12px;background:transparent;border:1px solid var(--border);color:var(--dim);font-size:12px;cursor:pointer;text-align:left;transition:all .15s;display:flex;align-items:center;gap:8px;}
.filter-btn:hover{border-color:var(--steel);color:var(--text);}
.filter-btn.active{border-color:var(--gold);color:var(--gold);background:rgba(232,188,56,0.07);}
.filter-btn .dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}

/* SORT & SEARCH */
.market-top{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap;}
.search-wrap{display:flex;gap:0;flex:1;min-width:200px;}
.search-box{flex:1;padding:10px 14px;background:var(--surf);border:1px solid var(--border);color:var(--text);font-size:13px;outline:none;transition:border-color .2s;}
.search-box:focus{border-color:var(--gold);}
.search-box::placeholder{color:var(--dim);}
.search-btn{padding:10px 16px;background:var(--gold);color:var(--bg);border:none;cursor:pointer;font-size:13px;font-weight:500;transition:background .2s;}
.search-btn:hover{background:var(--gold2);}
.sort-select{padding:10px 14px;background:var(--surf);border:1px solid var(--border);color:var(--text);font-size:12px;outline:none;cursor:pointer;}
.sort-select option{background:var(--card);}
.result-count{font-size:12px;color:var(--dim);white-space:nowrap;}

/* GRID */
.market-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:12px;}
.empty-state{grid-column:1/-1;text-align:center;padding:60px 20px;font-size:14px;color:var(--dim);}

/* CARD */
.market-card{background:var(--card);border:1px solid var(--border);cursor:pointer;transition:border-color .2s,transform .15s;display:flex;flex-direction:column;}
.market-card:hover{border-color:var(--gold);transform:translateY(-2px);}
.card-img{position:relative;padding:16px;background:var(--surf);border-bottom:1px solid var(--border);}

.tag-rent{position:absolute;bottom:6px;left:8px;font-family:var(--px);font-size:7px;background:rgba(232,128,56,0.2);color:#e88038;border:1px solid rgba(232,128,56,0.3);padding:2px 6px;}
.card-body{padding:12px;display:flex;flex-direction:column;gap:6px;flex:1;}
.card-name{font-size:13px;color:#fff;font-weight:500;}
.card-tier{font-size:10px;color:var(--dim);}
.card-seller{font-size:11px;color:var(--dim);}

.card-price{font-family:var(--px);font-size:12px;color:var(--gold);}
.card-price span{font-size:9px;color:var(--dim);}
.card-alt-price{font-size:10px;color:var(--dim);margin-top:2px;}
.card-buy-btn{margin-top:8px;width:100%;padding:9px;background:rgba(232,188,56,0.1);border:1px solid var(--gold);color:var(--gold);font-size:11px;cursor:pointer;transition:all .2s;letter-spacing:.5px;}
.card-buy-btn:hover{background:var(--gold);color:var(--bg);}

/* ITEM MODAL */
#item-modal{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.8);z-index:500;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);}
.item-modal-box{background:var(--card);border:1px solid var(--border);max-width:700px;width:100%;max-height:90vh;overflow-y:auto;}
.item-modal-header{padding:20px 24px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;}
.item-modal-close{background:transparent;border:1px solid var(--border);color:var(--dim);width:34px;height:34px;font-size:18px;cursor:pointer;transition:all .2s;}
.item-modal-close:hover{border-color:var(--gold);color:var(--gold);}
.item-modal-grid{display:grid;grid-template-columns:1fr 1fr;gap:24px;padding:24px;}
.item-modal-img{background:var(--surf);border:1px solid var(--border);padding:20px;}
.item-modal-img svg{width:100%;height:140px;}
.item-modal-name{font-family:var(--px);font-size:15px;color:#fff;margin-bottom:6px;line-height:1.4;}
.item-modal-meta{font-size:12px;color:var(--dim);margin-bottom:10px;}
.item-modal-seller{font-size:13px;color:var(--dim);margin-bottom:16px;}
.item-modal-stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:16px;}
.modal-stat{background:var(--surf);padding:8px 12px;}
.modal-stat span{font-size:10px;color:var(--dim);display:block;margin-bottom:2px;}

.modal-wish-btn{padding:12px 16px;background:transparent;color:var(--dim);border:1px solid var(--border);cursor:pointer;font-size:13px;transition:all .2s;}
.modal-wish-btn:hover{border-color:#e88038;color:#e88038;}

/* TOAST */
#toast{position:fixed;bottom:24px;right:24px;z-index:600;padding:14px 20px;background:var(--card);border:1px solid var(--border);font-size:13px;color:var(--text);max-width:320px;transform:translateY(80px);opacity:0;transition:all .3s;}

@media(max-width:900px){

}
</style>
</head>
