  onSnapshot, serverTimestamp, addDoc }

const app = initializeApp({
  apiKey:"AIzaSyC3VbYFS0AfyY9TquptvezYu66w-djUkiw",
  authDomain:"tanksbattles3d.firebaseapp.com",
  projectId:"tanksbattles3d",
  storageBucket:"tanksbattles3d.firebasestorage.app",
  messagingSenderId:"626439210789",

});
const auth = getAuth(app);
const db   = getFirestore(app);
window._db = db; window._auth = auth;

let currentAdmin = null;

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'profile.html'; return; }
  const snap = await getDoc(doc(db, 'players', user.uid));
  if (!snap.exists() || !['admin','moderator'].includes(snap.data().role)) {
    document.getElementById('access-denied').style.display = 'flex';
    document.getElementById('admin-panel').style.display = 'none';
    return;
  }
  currentAdmin = { uid: user.uid, ...snap.data() };
  window._currentAdmin = currentAdmin;
  document.getElementById('access-denied').style.display = 'none';
  document.getElementById('admin-panel').style.display = 'block';
  document.getElementById('admin-nick').textContent = snap.data().nickname || user.email;
  document.getElementById('admin-role').textContent =
    snap.data().role === 'admin' ? '👑 Адміністратор' : '🛡 Модератор';
  loadDashboard();
  loadPlayers();
  loadPromocodes();
});

// ── DASHBOARD ─────────────────────────────────────────────────
async function loadDashboard() {
  try {
    // Site stats — з захистом від відсутності документа
    try {
      onSnapshot(doc(db,'siteStats','main'), snap => {
        if (!snap.exists()) {
          setText('dash-total-visits', '0');
          setText('dash-unique-visits', '0');
          return;
        }
        const d = snap.data();
        setText('dash-total-visits',  (d.totalVisits||0).toLocaleString());
        setText('dash-unique-visits', (d.uniqueVisitors||0).toLocaleString());
      });
    } catch(e) { setText('dash-total-visits','—'); }

    const today = new Date().toISOString().slice(0,10);
    try {
      onSnapshot(doc(db,'siteStats','daily_'+today), snap => {
        if (!snap.exists()) { setText('dash-today-visits','0'); return; }
        setText('dash-today-visits', (snap.data().visits||0).toLocaleString());
      });
    } catch(e) { setText('dash-today-visits','—'); }

    // Players count — без orderBy щоб не потребував індекс
    try {
      const pSnap = await getDocs(collection(db,'players'));
      setText('dash-players', pSnap.size.toLocaleString());
    } catch(e) { setText('dash-players','—'); }

    // Clans count
    try {
      const cSnap = await getDocs(collection(db,'clans'));
      setText('dash-clans', cSnap.size.toLocaleString());
    } catch(e) { setText('dash-clans','—'); }

    // Top player — може потребувати індекс, обробляємо окремо
    try {
      const topSnap = await getDocs(query(collection(db,'players'),orderBy('rating','desc'),limit(1)));
      if (!topSnap.empty) {
        const t = topSnap.docs[0].data();
        setText('dash-top-player', (t.nickname||'—') + ' · ' + (t.rating||0));
      } else { setText('dash-top-player','—'); }
    } catch(e) { setText('dash-top-player','Індекс будується...'); }

    // Banned count
    try {
      const banSnap = await getDocs(query(collection(db,'players'),where('banned','==',true)));
      setText('dash-banned', banSnap.size.toLocaleString());
    } catch(e) { setText('dash-banned','—'); }

  } catch(e) { console.error('Dashboard error:', e); }
}

// ── PLAYERS ───────────────────────────────────────────────────
let playersCache = [];

window.loadPlayers = async function(searchQ='') {
  const list = document.getElementById('players-list');
  list.innerHTML = '<tr><td colspan="8" class="loading-row">Завантаження...</td></tr>';
  try {
    let q;
    if (searchQ) {
      q = query(collection(db,'players'),
        where('nickname','>=',searchQ),
        where('nickname','<=',searchQ+'\uf8ff'),
        limit(50));
    } else {
      q = query(collection(db,'players'), orderBy('createdAt','desc'), limit(50));
    }
    const snap = await getDocs(q);
    playersCache = [];
    snap.forEach(d => playersCache.push({id:d.id,...d.data()}));
    renderPlayers(playersCache);
  } catch(e) {
    list.innerHTML = `<tr><td colspan="8" class="loading-row" style="color:#c07070">Помилка: ${e.message}</td></tr>`;
  }
};

function renderPlayers(players) {
  const list = document.getElementById('players-list');
  if (!players.length) {
    list.innerHTML = '<tr><td colspan="8" class="loading-row">Гравців не знайдено</td></tr>';
    return;
  }
  list.innerHTML = players.map(p => {
    const wr = p.battles>0 ? Math.round(p.wins/p.battles*100) : 0;
    const banned = p.banned ? '🚫 Заблокований' : '✅ Активний';
    const roleColor = p.role==='admin'?'#ffd700':p.role==='moderator'?'#a070cc':'var(--dim)';
    const created = p.createdAt?.toDate ? p.createdAt.toDate().toLocaleDateString('uk-UA') : '—';
    return `<tr onclick="openPlayer('${p.id}')" style="cursor:pointer">
      <td><span class="player-nick">${p.nickname||'—'}</span></td>
      <td style="font-size:10px;color:${roleColor}">${p.role||'user'}</td>
      <td>LVL ${p.level||1}</td>
      <td style="color:var(--gold)">${(p.rating||0).toLocaleString()}</td>
      <td>${p.battles||0} · ${wr}%</td>
      <td style="color:var(--gold)">${(p.gold||0).toLocaleString()}</td>
      <td style="font-size:11px;color:var(--dim)">${created}</td>
      <td><span style="font-size:11px;color:${p.banned?'#c07070':'#4aaa5a'}">${banned}</span></td>
    </tr>`;
  }).join('');
}

window.openPlayer = function(uid) {
  const p = playersCache.find(x => x.id === uid);
  if (!p) return;
  const modal = document.getElementById('player-modal');
  document.getElementById('pm-nick').textContent = p.nickname || '—';
  document.getElementById('pm-uid').textContent = uid;
  document.getElementById('pm-role').value = p.role || 'user';
  document.getElementById('pm-gold').value = p.gold || 0;
  document.getElementById('pm-coins').value = p.coins || 0;
  document.getElementById('pm-fuel').value = p.fuel || 0;
  document.getElementById('pm-oil').value = p.oil || 0;
  document.getElementById('pm-metal').value = p.metal || 0;
  document.getElementById('pm-ban-reason').value = p.banReason || '';
  document.getElementById('pm-banned-status').textContent = p.banned ? '🚫 Заблокований' : '✅ Активний';
  document.getElementById('pm-banned-status').style.color = p.banned ? '#c07070' : '#4aaa5a';
  document.getElementById('pm-ban-btn').textContent = p.banned ? '✅ Розблокувати' : '🚫 Заблокувати';
  document.getElementById('pm-ban-btn').onclick = () => toggleBan(uid, p.banned);
  document.getElementById('pm-save-btn').onclick = () => savePlayer(uid);
  modal.style.display = 'flex';
  document.body.style.overflow = 'hidden';
};

window.savePlayer = async function(uid) {
  const role      = document.getElementById('pm-role').value;
  const gold      = parseInt(document.getElementById('pm-gold').value) || 0;
  const coins     = parseInt(document.getElementById('pm-coins').value) || 0;
  const fuel      = parseInt(document.getElementById('pm-fuel').value) || 0;
  const oil       = parseInt(document.getElementById('pm-oil').value) || 0;
  const metal     = parseInt(document.getElementById('pm-metal').value) || 0;
  try {
    await updateDoc(doc(db,'players',uid), { role, gold, coins, fuel, oil, metal });
    showToast('✅ Гравця оновлено');
    closePlayerModal();
    loadPlayers();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

window.toggleBan = async function(uid, isBanned) {
  const reason = document.getElementById('pm-ban-reason').value;
  try {
    await updateDoc(doc(db,'players',uid), {
      banned: !isBanned,
      banReason: isBanned ? '' : reason
    });
    showToast(isBanned ? '✅ Розблоковано' : '🚫 Заблоковано');
    closePlayerModal();
    loadPlayers();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

window.closePlayerModal = function() {
  document.getElementById('player-modal').style.display = 'none';
  document.body.style.overflow = '';
};

// ── PROMOCODES ────────────────────────────────────────────────
window.loadPromocodes = async function() {
  const list = document.getElementById('promo-list');
  list.innerHTML = '<tr><td colspan="6" class="loading-row">Завантаження...</td></tr>';
  try {
    const snap = await getDocs(query(collection(db,'promocodes'), orderBy('createdAt','desc')));
    if (snap.empty) {
      list.innerHTML = '<tr><td colspan="6" class="loading-row">Промокодів немає</td></tr>';
      return;
    }
    list.innerHTML = snap.docs.map(d => {
      const p = d.data();
      const exp = p.expiresAt?.toDate ? p.expiresAt.toDate().toLocaleDateString('uk-UA') : '—';
      const reward = Object.entries(p.reward||{}).map(([k,v])=>`${v} ${k}`).join(', ');
      const used = (p.usedBy||[]).length;
      return `<tr>
        <td><span class="promo-code">${d.id}</span></td>
        <td style="color:var(--gold)">${reward}</td>
        <td>${used} / ${p.maxUses||'∞'}</td>
        <td style="font-size:11px;color:var(--dim)">${exp}</td>
        <td><span style="color:${p.active?'#4aaa5a':'#c07070'}">${p.active?'✅ Активний':'❌ Неактивний'}</span></td>
        <td style="display:flex;gap:6px">
          <button class="tbl-btn" onclick="togglePromo('${d.id}',${p.active})">${p.active?'Вимк':'Увімк'}</button>
          <button class="tbl-btn danger" onclick="deletePromo('${d.id}')">Видалити</button>
        </td>
      </tr>`;
    }).join('');
  } catch(e) {
    list.innerHTML = `<tr><td colspan="6" class="loading-row" style="color:#c07070">Помилка: ${e.message}</td></tr>`;
  }
};

window.createPromo = async function() {
  const code    = document.getElementById('new-promo-code').value.trim().toUpperCase();
  const gold    = parseInt(document.getElementById('new-promo-gold').value)||0;
  const coins   = parseInt(document.getElementById('new-promo-coins').value)||0;
  const fuel    = parseInt(document.getElementById('new-promo-fuel').value)||0;
  const oil     = parseInt(document.getElementById('new-promo-oil').value)||0;
  const metal   = parseInt(document.getElementById('new-promo-metal').value)||0;
  const maxUses = parseInt(document.getElementById('new-promo-maxuses').value)||99999;
  const desc    = document.getElementById('new-promo-desc').value.trim();
  const days    = parseInt(document.getElementById('new-promo-days').value)||30;

  if (!code || code.length < 3) { showToast('Введи код (мін. 3 символи)','error'); return; }

  const reward = {};
  if (gold)  reward.gold  = gold;
  if (coins) reward.coins = coins;
  if (fuel)  reward.fuel  = fuel;
  if (oil)   reward.oil   = oil;
  if (metal) reward.metal = metal;
  if (!Object.keys(reward).length) { showToast('Вкажи хоча б одну нагороду','error'); return; }

  const expires = new Date();
  expires.setDate(expires.getDate() + days);

  try {
    await setDoc(doc(db,'promocodes',code), {
      code, reward, usedBy:[], active:true, maxUses, description:desc,
      expiresAt: expires, createdAt: new Date(),
      createdBy: currentAdmin?.uid || 'admin'
    });
    showToast('✅ Промокод '+code+' створено!');
    // Очистити форму
    ['new-promo-code','new-promo-gold','new-promo-coins','new-promo-fuel',
     'new-promo-oil','new-promo-metal','new-promo-desc'].forEach(id => {
      document.getElementById(id).value = '';
    });
    document.getElementById('new-promo-maxuses').value = '99999';
    document.getElementById('new-promo-days').value = '30';
    loadPromocodes();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

window.togglePromo = async function(code, isActive) {
  try {
    await updateDoc(doc(db,'promocodes',code), { active: !isActive });
    showToast(isActive ? 'Промокод вимкнено' : 'Промокод увімкнено');
    loadPromocodes();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

window.deletePromo = async function(code) {
  if (!confirm('Видалити промокод '+code+'?')) return;
  try {
    await deleteDoc(doc(db,'promocodes',code));
    showToast('Промокод видалено');
    loadPromocodes();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

// ── NEWS ──────────────────────────────────────────────────────
window.loadNews = async function() {
  const list = document.getElementById('news-list');
  list.innerHTML = '<div class="loading-row">Завантаження...</div>';
  try {
    const snap = await getDocs(query(collection(db,'news'), orderBy('createdAt','desc'), limit(20)));
    if (snap.empty) { list.innerHTML = '<div class="loading-row">Новин немає</div>'; return; }
    list.innerHTML = snap.docs.map(d => {
      const n = d.data();
      const date = n.createdAt?.toDate ? n.createdAt.toDate().toLocaleDateString('uk-UA') : '—';
      return `<div class="news-admin-row">
        <div>
          <div class="news-admin-title">${n.title||'—'}</div>
          <div style="font-size:11px;color:var(--dim)">${date} · ${n.tag||'—'}</div>
        </div>
        <div style="display:flex;gap:6px">
          <button class="tbl-btn" onclick="editNews('${d.id}')">Редагувати</button>
          <button class="tbl-btn danger" onclick="deleteNews('${d.id}')">Видалити</button>
        </div>
      </div>`;
    }).join('');
  } catch(e) { list.innerHTML = `<div class="loading-row" style="color:#c07070">Помилка: ${e.message}</div>`; }
};

window.createNews = async function() {
  const title = document.getElementById('news-title').value.trim();
  const tag   = document.getElementById('news-tag').value.trim();
  const text  = document.getElementById('news-text').value.trim();
  if (!title || !text) { showToast('Заповни заголовок і текст','error'); return; }
  try {
    await addDoc(collection(db,'news'), {
      title, tag: tag||'Оновлення', text, pinned: false,
      createdAt: new Date(), authorId: currentAdmin?.uid,
      authorNick: currentAdmin?.nickname || 'Адмін'
    });
    showToast('✅ Новину опубліковано!');
    document.getElementById('news-title').value = '';
    document.getElementById('news-tag').value = '';
    document.getElementById('news-text').value = '';
    loadNews();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

window.deleteNews = async function(id) {
  if (!confirm('Видалити новину?')) return;
  try { await deleteDoc(doc(db,'news',id)); showToast('Видалено'); loadNews(); }
  catch(e) { showToast('Помилка: '+e.message,'error'); }
};

// ── HELPERS ───────────────────────────────────────────────────
function setText(id,val){ const el=document.getElementById(id); if(el) el.textContent=val; }
function showToast(msg,type=''){
  const t=document.getElementById('toast');
  t.textContent=msg; t.className='show'+(type?' '+type:'');
  setTimeout(()=>t.className='',3000);
}
window.showToast=showToast;
window.adminSignOut = () => signOut(auth).then(()=>window.location.href='profile.html');

// ── TANKS DB ──────────────────────────────────────────────────
const FACTION_LBL = { east:'🔴 East', west:'🔵 West', north:'⚫ North', euro:'🟣 Euro', asian:'🟡 Asian' };
const CLASS_LBL   = { assault:'⚔️ Штурм', support:'🛡️ Підтримка', recon:'👁️ Розвідка', arty:'💥 Арта', medium:'⚙️ Універсал' };
const TIER_ROM    = ['','І','ІІ','ІІІ','IV','V','VI','VII','VIII','IX','X'];
let editingTankId = null;

window.loadTanksDB = async function() {
  const list = document.getElementById('tanks-db-list');
  list.innerHTML = '<div class="loading-row">Завантаження...</div>';
  try {
    const snap = await getDocs(collection(db,'tanks_db'));
    if (snap.empty) {
      list.innerHTML = '<div class="loading-row">База танків порожня. Натисни "+ Додати танк"</div>';
      return;
    }
    list.innerHTML = `<table><thead><tr>
      <th>Emoji</th><th>Назва</th><th>Фракція</th><th>Клас</th><th>Тір</th><th>Статус</th><th>Дії</th>
    </tr></thead><tbody>` +
    snap.docs.map(d => {
      const t = d.data();
      return `<tr>
        <td style="font-size:20px;text-align:center">${t.emoji||'🚀'}</td>
        <td><strong>${t.name||'—'}</strong><br><span style="font-size:10px;color:var(--dim)">${t.nation||''}</span></td>
        <td style="font-size:12px">${FACTION_LBL[t.faction]||t.faction}</td>
        <td style="font-size:12px">${CLASS_LBL[t.tankClass]||t.tankClass}</td>
        <td style="font-family:var(--px);font-size:11px;color:var(--gold)">${TIER_ROM[t.tier]||t.tier}</td>
        <td>${t.comingSoon?'<span style="color:var(--gold);font-size:11px">⏳ Скоро</span>':'<span style="color:var(--green);font-size:11px">✅ Активний</span>'}</td>
        <td style="display:flex;gap:6px">
          <button class="tbl-btn" onclick="openTankEditor('${d.id}')">✏️</button>
          <button class="tbl-btn" style="color:#c07070;border-color:#7a2020" onclick="deleteTank('${d.id}','${(t.name||'').replace(/'/g,"\\'")}')">🗑️</button>
        </td>
      </tr>`;
    }).join('') + '</tbody></table>';
  } catch(e) { list.innerHTML = `<div class="loading-row" style="color:#c07070">${e.message}</div>`; }
};

window.openTankEditor = async function(tankId) {
  editingTankId = tankId;
  document.getElementById('te-title').textContent = tankId ? 'Редагувати танк' : 'Новий танк';
  document.getElementById('te-msg').style.display = 'none';

  // Очищуємо
  ['id','name','emoji','nation','desc','role'].forEach(f => {
    const el = document.getElementById('te-'+f); if (el) el.value = '';
  });
  ['hp','damage','armor','speed','view','masking'].forEach(f => {
    const el = document.getElementById('te-'+f); if (el) el.value = '50';
  });
  [0,1,2].forEach(i => {
    ['icon','name','desc'].forEach(f => { const el = document.getElementById(`te-perk${i}-${f}`); if(el) el.value=''; });
  });
  document.getElementById('te-soon').checked = false;
  document.getElementById('te-img-preview').style.display = 'none';
  document.getElementById('te-img-url').value = '';

  if (tankId) {
    try {
      // Використовуємо вже імпортований doc і getDoc
      const snap = await getDoc(doc(db,'tanks_db',tankId));
      if (snap.exists()) {
        const t = snap.data();
        document.getElementById('te-id').value      = tankId;
        document.getElementById('te-id').disabled   = true;
        document.getElementById('te-name').value    = t.name||'';
        document.getElementById('te-emoji').value   = t.emoji||'';
        document.getElementById('te-nation').value  = t.nation||'';
        document.getElementById('te-faction').value = t.faction||'west';
        document.getElementById('te-class').value   = t.tankClass||'medium';
        document.getElementById('te-tier').value    = t.tier||1;
        document.getElementById('te-soon').checked  = !!t.comingSoon;
        document.getElementById('te-desc').value    = t.desc||'';
        document.getElementById('te-role').value    = t.role||'';
        // Зображення
        if (t.imageUrl) {
          document.getElementById('te-img-url').value = t.imageUrl;
          const prev = document.getElementById('te-img-preview');
          prev.src = t.imageUrl; prev.style.display = 'block';
        }
        const s = t.stats||{};
        ['hp','damage','armor','speed','view','masking'].forEach(f => {
          const el = document.getElementById('te-'+f); if(el) el.value = s[f]||50;
        });
        (t.perks||[]).forEach((p,i) => {
          if (i>2) return;
          document.getElementById(`te-perk${i}-icon`).value = p.icon||'';
          document.getElementById(`te-perk${i}-name`).value = p.name||'';
          document.getElementById(`te-perk${i}-desc`).value = p.desc||'';
        });
      }
    } catch(e) { console.error('openTankEditor error:', e); }
  } else {
    document.getElementById('te-id').disabled = false;
  }

  document.getElementById('tank-editor-modal').style.display = 'flex';
  document.body.style.overflow = 'hidden';
};

window.closeTankEditor = function() {
  document.getElementById('tank-editor-modal').style.display = 'none';
  document.body.style.overflow = '';
  editingTankId = null;
};

window.previewTankImg = function(url) {
  const prev = document.getElementById('te-img-preview');
  if (url) { prev.src = url; prev.style.display = 'block'; }
  else { prev.style.display = 'none'; }
};

window.uploadTankImg = async function(input) {
  const file = input.files[0];
  if (!file) return;
  if (file.size > 5 * 1024 * 1024) { showToast('Файл занадто великий (макс 5MB)','error'); return; }

  const msgEl = document.getElementById('te-msg');
  showMsg(msgEl, '⏳ Завантаження зображення...', 'ok');

  try {
    const { getStorage, ref, uploadBytesResumable, getDownloadURL } =
      await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js');
    const storage = getStorage();
    const tankId  = document.getElementById('te-id').value.trim() || 'tank_' + Date.now();
    const storageRef = ref(storage, `tanks/${tankId}_${file.name}`);
    const task = uploadBytesResumable(storageRef, file);

    const url = await new Promise((resolve, reject) => {
      task.on('state_changed', null, reject,
        async () => resolve(await getDownloadURL(task.snapshot.ref)));
    });

    document.getElementById('te-img-url').value = url;
    const prev = document.getElementById('te-img-preview');
    prev.src = url; prev.style.display = 'block';
    showMsg(msgEl, '✅ Зображення завантажено!', 'ok');
  } catch(e) {
    showMsg(msgEl, 'Помилка: ' + e.message, 'err');
  }
};

window.approveStreamer = async function(docId, uid) {
  const tier = document.getElementById('sm-tier').value;
  try {
    // Оновити статус заявки
    await updateDoc(doc(db,'streamer_applications',docId), { status: tier, updatedAt: new Date() });

    if (uid && tier !== 'pending' && tier !== 'rejected') {
      // Генеруємо код стрімера якщо немає
      const pSnap = await getDoc(doc(db,'players',uid));
      if (pSnap.exists()) {
        const pData = pSnap.data();
        const code  = pData.streamerCode || ('STREAM_'+(pData.nickname||'').toUpperCase().slice(0,8).replace(/\s/g,''));
        await updateDoc(doc(db,'players',uid), {
          streamerStatus: tier,
          streamerCode:   code,
          streamerApprovedAt: new Date(),
        });
      }
    } else if (uid && tier === 'rejected') {
      await updateDoc(doc(db,'players',uid), { streamerStatus: 'none' });
    }

    // Лог
    await addDoc(collection(db,'moderation_log'), {
      action: 'streamer_'+tier, adminNick: currentAdmin?.nickname||'Адмін',
      target: uid, details: TIER_LABELS[tier]||tier, createdAt: new Date()
    });

    showToast('✅ Статус стрімера оновлено');
    closeStreamerModal();
    loadStreamers();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

let giveTargetUID = { gr: null, gi: null };

window.searchForGive = async function(prefix) {
  const q = document.getElementById(prefix+'-search').value.trim();
  if (!q) { showToast('Введи нікнейм або UID','error'); return; }

  try {
    let playerData = null, playerUID = null;

    // Спроба як UID
    if (q.length > 20) {
      const snap = await getDoc(doc(db,'players',q));
      if (snap.exists()) { playerUID = q; playerData = snap.data(); }
    }

    // Пошук по нікнейму
    if (!playerData) {
      const snap = await getDocs(query(
        collection(db,'players'),
        where('nickname','>=',q),
        where('nickname','<=',q+'\uf8ff'),
        limit(1)
      ));
      if (!snap.empty) { playerUID = snap.docs[0].id; playerData = snap.docs[0].data(); }
    }

    if (!playerData) { showToast('Гравця не знайдено','error'); return; }

    giveTargetUID[prefix] = playerUID;
    const nick = playerData.nickname || '—';

    document.getElementById(prefix+'-avatar').textContent = nick[0].toUpperCase();
    document.getElementById(prefix+'-nick').textContent = nick;
    document.getElementById(prefix+'-uid-show').textContent = playerUID;

    if (prefix === 'gr') {
      setText('gr-cur-gold',  (playerData.gold||0).toLocaleString());
      setText('gr-cur-coins', (playerData.coins||0).toLocaleString());
      setText('gr-cur-oil',   (playerData.oil||0).toLocaleString());
      document.getElementById('gr-player-found').style.display = 'block';
      document.getElementById('gr-btn').disabled = false;
    } else {
      document.getElementById('gi-player-found').style.display = 'block';
      document.getElementById('gi-btn').disabled = false;
    }
    showToast('✅ Знайдено: '+nick);
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

// ── GIVE RESOURCES ────────────────────────────────────────────
window.giveResources = async function() {
  const uid = giveTargetUID['gr'];
  if (!uid) { showToast('Спочатку знайди гравця','error'); return; }

  const gold     = parseInt(document.getElementById('gr-gold').value)||0;
  const coins    = parseInt(document.getElementById('gr-coins').value)||0;
  const fuel     = parseInt(document.getElementById('gr-fuel').value)||0;
  const oil      = parseInt(document.getElementById('gr-oil').value)||0;
  const metal    = parseInt(document.getElementById('gr-metal').value)||0;
  const diamonds = parseInt(document.getElementById('gr-diamonds').value)||0;
  const reason   = document.getElementById('gr-reason').value.trim() || 'Видача адміном';

  if (!gold && !coins && !fuel && !oil && !metal && !diamonds) {
    showToast('Вкажи хоча б один ресурс','error'); return;
  }

  const btn = document.getElementById('gr-btn');
  btn.disabled = true; btn.textContent = '...';

  try {
    const updates = {};
    if (gold)     updates.gold     = increment(gold);
    if (coins)    updates.coins    = increment(coins);
    if (fuel)     updates.fuel     = increment(fuel);
    if (oil)      updates.oil      = increment(oil);
    if (metal)    updates.metal    = increment(metal);
    if (diamonds) updates.diamonds = increment(diamonds);

    await updateDoc(doc(db,'players',uid), updates);

    const nick = document.getElementById('gr-nick').textContent;
    const resText = [
      gold?`+${gold} золото`:'', coins?`+${coins} монети`:'',
      fuel?`+${fuel} паливо`:'', oil?`+${oil} нафта`:'',
      metal?`+${metal} метал`:'', diamonds?`+${diamonds} діаманти`:''
    ].filter(Boolean).join(', ');

    await addDoc(collection(db,'moderation_log'), {
      action:'give_resources', adminNick: currentAdmin?.nickname||'Адмін',
      target: uid, targetNick: nick, details: resText, reason, createdAt: new Date()
    });

    showToast(`✅ ${nick}: ${resText}`);
    ['gr-gold','gr-coins','gr-fuel','gr-oil','gr-metal','gr-diamonds'].forEach(id => {
      document.getElementById(id).value = '';
    });
    // Оновити баланс
    const fresh = await getDoc(doc(db,'players',uid));
    if (fresh.exists()) {
      const d = fresh.data();
      setText('gr-cur-gold',  (d.gold||0).toLocaleString());
      setText('gr-cur-coins', (d.coins||0).toLocaleString());
      setText('gr-cur-oil',   (d.oil||0).toLocaleString());
    }
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
  finally { btn.disabled = false; btn.textContent = '💰 Видати ресурси'; }
};

// ── GIVE ITEMS ────────────────────────────────────────────────
window.updateItemFields = function() {
  const type = document.getElementById('gi-type').value;
  const isSpecial = ['nickname_change','exp_boost','fuel_refill'].includes(type);
  document.getElementById('gi-name-wrap').style.display   = isSpecial ? 'none' : 'block';
  document.getElementById('gi-rarity-wrap').style.display = isSpecial ? 'none' : 'block';
  document.getElementById('gi-tier-wrap').style.display   = type === 'tank' ? 'block' : 'none';
  document.getElementById('gi-image-wrap').style.display  = isSpecial ? 'none' : 'block';
  document.getElementById('gi-nation-wrap').style.display = type === 'tank' ? 'block' : 'none';
};

window.giveItem = async function() {
  const uid  = giveTargetUID['gi'];
  if (!uid) { showToast('Спочатку знайди гравця','error'); return; }

  const type   = document.getElementById('gi-type').value;
  const name   = document.getElementById('gi-name').value.trim();
  const rarity = document.getElementById('gi-rarity').value;
  const tier   = parseInt(document.getElementById('gi-tier').value)||0;
  const image  = document.getElementById('gi-image').value.trim() || type;
  const nation = document.getElementById('gi-nation').value;
  const reason = document.getElementById('gi-reason').value.trim() || 'Видача адміном';
  const nick   = document.getElementById('gi-nick').textContent;

  const isSpecial = ['nickname_change','exp_boost','fuel_refill'].includes(type);
  if (!isSpecial && !name) { showToast('Введи назву айтему','error'); return; }

  const SPECIAL_NAMES = {
    nickname_change:'Зміна нікнейму', exp_boost:'Буст досвіду x2',
    fuel_refill:'Заправка палива', premium_camo:'Преміум камуфляж'
  };

  const btn = document.getElementById('gi-btn');
  btn.disabled = true; btn.textContent = '...';

  try {
    const itemData = {
      itemType: type,
      itemName: isSpecial ? SPECIAL_NAMES[type] : name,
      itemRarity: isSpecial ? 'epic' : rarity,
      itemTier: tier, itemImage: image, itemNation: nation||'',
      isListed: false, isRented: false,
      acquiredBy: 'admin', acquiredReason: reason, acquiredAt: new Date(),
    };
    const itemId = type + '_' + Date.now();
    await setDoc(doc(db,'inventory',uid,'items',itemId), itemData);
    await addDoc(collection(db,'moderation_log'), {
      action:'give_item', adminNick: currentAdmin?.nickname||'Адмін',
      target: uid, targetNick: nick, details: itemData.itemName, reason, createdAt: new Date()
    });
    showToast(`✅ ${nick} отримав: ${itemData.itemName}`);
    loadItemHistory();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
  finally { btn.disabled = false; btn.textContent = '📦 Видати айтем'; }
};

window.loadItemHistory = async function() {
  const el = document.getElementById('gi-history');
  if (!el) return;
  try {
    const snap = await getDocs(query(
      collection(db,'moderation_log'),
      where('action','==','give_item'),
      orderBy('createdAt','desc'), limit(10)
    ));
    if (snap.empty) { el.innerHTML = '<div style="color:var(--dim);font-size:12px">Ще не було видач</div>'; return; }
    el.innerHTML = '<table style="width:100%;border-collapse:collapse"><thead><tr>' +
      '<th style="font-family:var(--px);font-size:8px;color:var(--dim);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">Час</th>' +
      '<th style="font-family:var(--px);font-size:8px;color:var(--dim);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">Гравець</th>' +
      '<th style="font-family:var(--px);font-size:8px;color:var(--dim);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">Айтем</th>' +
      '<th style="font-family:var(--px);font-size:8px;color:var(--dim);padding:8px 10px;text-align:left;border-bottom:1px solid var(--border)">Причина</th>' +
      '</tr></thead><tbody>' +
      snap.docs.map(d => {
        const l = d.data();
        const t = l.createdAt?.toDate ? l.createdAt.toDate().toLocaleString('uk-UA') : '—';
        return `<tr>
          <td style="font-size:11px;color:var(--dim);padding:8px 10px;border-bottom:1px solid rgba(26,48,80,.3)">${t}</td>
          <td style="font-size:12px;color:#fff;padding:8px 10px;border-bottom:1px solid rgba(26,48,80,.3)">${l.targetNick||'—'}</td>
          <td style="font-size:12px;color:var(--gold);padding:8px 10px;border-bottom:1px solid rgba(26,48,80,.3)">${l.details||'—'}</td>
          <td style="font-size:11px;color:var(--dim);padding:8px 10px;border-bottom:1px solid rgba(26,48,80,.3)">${l.reason||'—'}</td>
        </tr>`;
      }).join('') + '</tbody></table>';
  } catch(e) { el.innerHTML = '<div style="color:#c07070;font-size:12px">'+e.message+'</div>'; }
};

// ── SHOW SECTION ──────────────────────────────────────────────
window.showSection = function(name) {
  document.querySelectorAll('.admin-section').forEach(s => s.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(s => s.classList.remove('active'));
  const el = document.getElementById('section-'+name);
  if (el) el.classList.add('active');
  // Підсвічуємо активну кнопку по data-section атрибуту
  const activeBtn = document.querySelector(`.sidebar-item[data-section="${name}"]`);
  if (activeBtn) activeBtn.classList.add('active');
  if (name === 'logs') loadLogs();
  if (name === 'give-items') loadItemHistory();
  if (name === 'bans') loadBans();
};

// ── LOGS ──────────────────────────────────────────────────────
async function loadLogs() {
  const list = document.getElementById('logs-list');
  try {
    const snap = await getDocs(query(collection(db,'moderation_log'), orderBy('createdAt','desc'), limit(50)));
    if (snap.empty) { list.innerHTML = '<div class="loading-row">Логів немає</div>'; return; }
    list.innerHTML = '<table><thead><tr><th>Час</th><th>Адмін</th><th>Дія</th><th>Ціль</th><th>Деталі</th></tr></thead><tbody>' +
      snap.docs.map(d => {
        const l = d.data();
        const t = l.createdAt?.toDate ? l.createdAt.toDate().toLocaleString('uk-UA') : '—';
        const actionColor = l.action?.includes('ban') ? '#c07070' : l.action?.includes('give') ? '#4aaa5a' : 'var(--gold)';
        return `<tr>
          <td style="font-size:11px;color:var(--dim)">${t}</td>
          <td style="font-size:12px">${l.adminNick||'—'}</td>
          <td style="color:${actionColor};font-size:11px">${l.action||'—'}</td>
          <td style="font-size:12px">${l.targetNick||l.target||'—'}</td>
          <td style="font-size:11px;color:var(--dim)">${l.details||l.reason||'—'}</td>
        </tr>`;
      }).join('') + '</tbody></table>';
  } catch(e) { list.innerHTML = '<div class="loading-row" style="color:#c07070">'+e.message+'</div>'; }
}
</script>

<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js';
import { getAuth, onAuthStateChanged, signOut } from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js';
import { getFirestore, doc, getDoc, setDoc, updateDoc, deleteDoc,
  collection, query, orderBy, limit, getDocs, where, increment,
  onSnapshot, addDoc }
  from 'https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js';

const app = initializeApp({
  apiKey:"AIzaSyC3VbYFS0AfyY9TquptvezYu66w-djUkiw",
  authDomain:"tanksbattles3d.firebaseapp.com", projectId:"tanksbattles3d",
  storageBucket:"tanksbattles3d.firebasestorage.app",
  messagingSenderId:"626439210789",
  appId:"1:626439210789:web:3445ea49a9196e08e27ccc"
});
const auth = getAuth(app);
const db   = getFirestore(app);
window._db = db;

let currentAdmin = null;
let isAdmin = false;

onAuthStateChanged(auth, async user => {
  if (!user) { window.location.href = 'profile.html'; return; }
  const snap = await getDoc(doc(db,'players',user.uid));
  if (!snap.exists() || !['admin','moderator'].includes(snap.data().role)) {
    document.getElementById('access-denied').style.display = 'flex';
    return;
  }
  currentAdmin = { uid: user.uid, ...snap.data() };
  isAdmin = snap.data().role === 'admin';
  window._isAdmin = isAdmin;

  document.getElementById('admin-panel').style.display = 'block';
  document.getElementById('admin-nick').textContent = snap.data().nickname || user.email;
  document.getElementById('admin-role').textContent = isAdmin ? '👑 Адміністратор' : '🛡 Модератор';
  document.getElementById('nav-role-badge').textContent = isAdmin ? 'ADMIN' : 'MOD';
  if (!isAdmin) {
    document.getElementById('nav-role-badge').style.color = '#8eb0cc';
    document.getElementById('nav-role-badge').style.borderColor = '#8eb0cc';
  }

  // Показати admin-only елементи тільки для адмінів
  if (isAdmin) {
    document.querySelectorAll('.admin-only').forEach(el => { el.style.display = el.tagName==='DIV'&&el.classList.contains('sidebar-item') ? 'flex' : 'block'; });
    document.getElementById('sb-admin-tools').style.display = 'block';
    document.getElementById('sb-admin-base').style.display = 'block';
    document.getElementById('sb-admin-content').style.display = 'block';
    document.getElementById('dash-forum-card').style.display = 'block';
  }

  loadDashboard();
  loadPlayers();
  if (isAdmin) loadPromocodes();
});

// ── DASHBOARD ─────────────────────────────────────────────────
async function loadDashboard() {
  try {
    try { onSnapshot(doc(db,'siteStats','main'), s => {
      if (!s.exists()) return;
      const d = s.data();
      setText('dash-total-visits',(d.totalVisits||0).toLocaleString());
      setText('dash-unique-visits',(d.uniqueVisitors||0).toLocaleString());
    }); } catch(e) {}
    const today = new Date().toISOString().slice(0,10);
    try { onSnapshot(doc(db,'siteStats','daily_'+today), s => {
      setText('dash-today-visits', s.exists() ? (s.data().visits||0).toLocaleString() : '0');
    }); } catch(e) {}

    const [pS,cS,bS,tS,rS,fS] = await Promise.allSettled([
      getDocs(collection(db,'players')),
      getDocs(collection(db,'clans')),
      getDocs(query(collection(db,'players'),where('banned','==',true))),
      getDocs(query(collection(db,'support_tickets'),where('status','==','open'))),
      getDocs(query(collection(db,'support_tickets'),where('type','==','report'),where('status','==','open'))),
      getDocs(collection(db,'forum_posts')),
    ]);
    if(pS.status==='fulfilled') setText('dash-players',pS.value.size.toLocaleString());
    if(cS.status==='fulfilled') setText('dash-clans',cS.value.size.toLocaleString());
    if(bS.status==='fulfilled') setText('dash-banned',bS.value.size.toLocaleString());
    if(tS.status==='fulfilled') setText('dash-open-tickets',tS.value.size.toLocaleString());
    if(rS.status==='fulfilled') setText('dash-reports',rS.value.size.toLocaleString());
    if(fS.status==='fulfilled') setText('dash-forum-posts',fS.value.size.toLocaleString());

    try {
      const topS = await getDocs(query(collection(db,'players'),orderBy('rating','desc'),limit(1)));
      if(!topS.empty) { const t=topS.docs[0].data(); setText('dash-top-player',(t.nickname||'—')+' · ⭐ '+(t.rating||0).toLocaleString()); }
    } catch(e) { setText('dash-top-player','Індекс будується...'); }

    try {
      const logS = await getDocs(query(collection(db,'moderation_log'),orderBy('createdAt','desc'),limit(5)));
      const el = document.getElementById('dash-recent-logs');
      if(logS.empty) { el.innerHTML='<div style="color:var(--dim);font-size:12px">Логів немає</div>'; return; }
      const ac = a=>a.includes('ban')?'#c07070':a.includes('give')?'#4aaa5a':'var(--gold)';
      el.innerHTML = logS.docs.map(d=>{
        const l=d.data(), t=l.createdAt?.toDate?l.createdAt.toDate().toLocaleString('uk-UA'):'—';
        return `<div style="display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--card);border:1px solid var(--border);font-size:12px">
          <span style="color:${ac(l.action||'')}">●</span><span>${l.action||'—'}</span>
          <span style="color:var(--text)">${l.adminNick||'—'}</span>
          <span style="color:var(--dim)">→ ${l.targetNick||l.target||'—'}</span>
          <span style="margin-left:auto;color:var(--dim);font-size:10px">${t}</span></div>`;
      }).join('');
    } catch(e) {}
  } catch(e) { console.error('Dashboard:',e); }
}

// ── PLAYERS ───────────────────────────────────────────────────
let playersCache = [];

window.loadPlayers = async function(searchQ='') {
  const list = document.getElementById('players-list');
  const fv = document.getElementById('player-filter')?.value||'all';
  list.innerHTML = '<tr><td colspan="9" class="loading-row">Завантаження...</td></tr>';
  try {
    let q;
    if (searchQ) {
      q = query(collection(db,'players'),where('nickname','>=',searchQ),where('nickname','<=',searchQ+'\uf8ff'),limit(50));
    } else if (fv==='banned') {
      q = query(collection(db,'players'),where('banned','==',true),limit(50));
    } else if (fv==='staff') {
      q = query(collection(db,'players'),where('role','in',['admin','moderator']),limit(50));
    } else {
      q = query(collection(db,'players'),orderBy('createdAt','desc'),limit(50));
    }
    const snap = await getDocs(q);
    playersCache = [];
    snap.forEach(d => playersCache.push({id:d.id,...d.data()}));
    renderPlayers(playersCache);
  } catch(e) { list.innerHTML=`<tr><td colspan="9" class="loading-row" style="color:#c07070">${e.message}</td></tr>`; }
};

function renderPlayers(players) {
  const list = document.getElementById('players-list');
  if (!players.length) { list.innerHTML='<tr><td colspan="9" class="loading-row">Не знайдено</td></tr>'; return; }
  list.innerHTML = players.map(p => {
    const wr = p.battles>0?Math.round(p.wins/p.battles*100):0;
    const rc = p.role==='admin'?'#ffd700':p.role==='moderator'?'#a070cc':'var(--dim)';
    const cr = p.createdAt?.toDate?p.createdAt.toDate().toLocaleDateString('uk-UA'):'—';
    const quickBanBtn = isAdmin
      ? `<button class="tbl-btn danger" title="${p.banned?'Розблокувати':'Заблокувати'}" onclick="event.stopPropagation();quickBan('${p.id}','${(p.nickname||'').replace(/'/g,"\\'")}',${!!p.banned})">${p.banned?'✅':'🚫'}</button>`
      : '';
    return `<tr onclick="openPlayer('${p.id}')" style="cursor:pointer">
      <td><span class="player-nick">${p.nickname||'—'}</span></td>
      <td style="font-size:10px;color:${rc}">${p.role||'user'}</td>
      <td>LVL ${p.level||1}</td>
      <td style="color:var(--gold)">${(p.rating||0).toLocaleString()}</td>
      <td>${p.battles||0} · ${wr}%</td>
      <td style="color:var(--gold)">${(p.gold||0).toLocaleString()}</td>
      <td style="font-size:11px;color:var(--dim)">${cr}</td>
      <td><span style="font-size:11px;color:${p.banned?'#c07070':'#4aaa5a'}">${p.banned?'🚫':'✅'}</span></td>
      <td style="display:flex;gap:4px"><button class="tbl-btn" onclick="event.stopPropagation();openPlayer('${p.id}')">✏️</button>${quickBanBtn}</td>
    </tr>`;
  }).join('');
}

window.quickBan = async function(uid, nick, isBanned) {
  const reason = isBanned?'':(prompt(`Причина бану для ${nick}:`)||'Порушення');
  if (!isBanned && reason===null) return;
  try {
    await updateDoc(doc(db,'players',uid),{banned:!isBanned,banReason:reason});
    await addDoc(collection(db,'moderation_log'),{action:isBanned?'unban':'ban',adminNick:currentAdmin?.nickname||'Адмін',target:uid,targetNick:nick,details:reason,createdAt:new Date()});
    showToast(isBanned?'✅ Розблоковано':'🚫 Заблоковано');
    loadPlayers();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

window.openPlayer = function(uid) {
  const p = playersCache.find(x=>x.id===uid);
  if (!p) return;
  document.getElementById('pm-nick').textContent=p.nickname||'—';
  document.getElementById('pm-uid').textContent=uid;
  document.getElementById('pm-role').value=p.role||'user';
  document.getElementById('pm-gold').value=p.gold||0;
  document.getElementById('pm-coins').value=p.coins||0;
  document.getElementById('pm-fuel').value=p.fuel||0;
  document.getElementById('pm-oil').value=p.oil||0;
  document.getElementById('pm-metal').value=p.metal||0;
  document.getElementById('pm-ban-reason').value=p.banReason||'';
  document.getElementById('pm-note').value=p.adminNote||'';
  document.getElementById('pm-banned-status').textContent=p.banned?'🚫 Заблокований':'✅ Активний';
  document.getElementById('pm-banned-status').style.color=p.banned?'#c07070':'#4aaa5a';
  document.getElementById('pm-ban-btn').textContent=p.banned?'✅ Розблокувати':'🚫 Заблокувати';
  document.getElementById('pm-ban-btn').onclick=()=>toggleBan(uid,p.banned);
  document.getElementById('pm-save-btn').onclick=()=>savePlayer(uid);
  document.getElementById('player-modal').style.display='flex';
  document.body.style.overflow='hidden';
};

window.savePlayer = async function(uid) {
  try {
    await updateDoc(doc(db,'players',uid),{
      role:document.getElementById('pm-role').value,
      gold:parseInt(document.getElementById('pm-gold').value)||0,
      coins:parseInt(document.getElementById('pm-coins').value)||0,
      fuel:parseInt(document.getElementById('pm-fuel').value)||0,
      oil:parseInt(document.getElementById('pm-oil').value)||0,
      metal:parseInt(document.getElementById('pm-metal').value)||0,
      adminNote:document.getElementById('pm-note').value.trim(),
    });
    await addDoc(collection(db,'moderation_log'),{action:'edit_player',adminNick:currentAdmin?.nickname||'Адмін',target:uid,createdAt:new Date()});
    showToast('✅ Оновлено');
    closePlayerModal();
    loadPlayers();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};

window.toggleBan = async function(uid, isBanned) {
  const reason = document.getElementById('pm-ban-reason').value;
  try {
    await updateDoc(doc(db,'players',uid),{banned:!isBanned,banReason:isBanned?'':reason});
    await addDoc(collection(db,'moderation_log'),{action:isBanned?'unban':'ban',adminNick:currentAdmin?.nickname||'Адмін',target:uid,targetNick:document.getElementById('pm-nick').textContent,details:reason,createdAt:new Date()});
    showToast(isBanned?'✅ Розблоковано':'🚫 Заблоковано');
    closePlayerModal(); loadPlayers();
  } catch(e) { showToast('Помилка: '+e.message,'error'); }
};
window.closePlayerModal=function(){document.getElementById('player-modal').style.display='none';document.body.style.overflow='';};

// ── FORUM MOD ─────────────────────────────────────────────────
window.loadForumMod = async function() {
  const list=document.getElementById('forum-mod-list');
  const cat=document.getElementById('forum-cat-filter')?.value||'all';
  list.innerHTML='<div class="loading-row">Завантаження...</div>';
  try {
    const q = cat==='all'
      ? query(collection(db,'forum_posts'),orderBy('createdAt','desc'),limit(30))
      : query(collection(db,'forum_posts'),where('category','==',cat),orderBy('createdAt','desc'),limit(30));
    const snap=await getDocs(q);
    if(snap.empty){list.innerHTML='<div class="loading-row">Постів немає</div>';return;}
    const CC={general:'var(--steel)',bug:'#e84040',idea:'#a070cc',clan:'var(--gold)',tournaments:'#4aaa5a'};
    const CL={general:'💬',bug:'🐛',idea:'💡',clan:'🏰',tournaments:'🏆'};
    list.innerHTML=snap.docs.map(d=>{
      const p=d.data(),date=p.createdAt?.toDate?p.createdAt.toDate().toLocaleString('uk-UA'):'—',c=CC[p.category]||'var(--dim)';
      return`<div class="forum-post-row">
        <div style="flex:1;min-width:0">
          <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
            <span class="forum-post-badge" style="color:${c};border-color:${c}44">${CL[p.category]||'📝'} ${p.category||'—'}</span>
            ${p.pinned?'<span class="forum-post-badge" style="color:var(--gold);border-color:rgba(232,188,56,0.4)">📌</span>':''}
            ${p.locked?'<span class="forum-post-badge" style="color:var(--dim);border-color:var(--border)">🔒</span>':''}
          </div>
          <div class="forum-post-title">${p.title||'—'}</div>
          <div class="forum-post-meta">👤 ${p.authorNick||'—'} · ${date} · 💬 ${p.replyCount||0} · 👍 ${p.likes||0}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
          <button class="tbl-btn" onclick="togglePin('${d.id}',${!!p.pinned})">${p.pinned?'📌 Зняти':'📌 Закріп'}</button>
          <button class="tbl-btn" onclick="toggleLock('${d.id}',${!!p.locked})">${p.locked?'🔓 Відкрити':'🔒 Закрити'}</button>
          <button class="tbl-btn danger" onclick="deleteForumPost('${d.id}')">🗑️</button>
        </div>
      </div>`;
    }).join('');
  } catch(e){list.innerHTML=`<div class="loading-row" style="color:#c07070">${e.message}</div>`;}
};

window.togglePin=async function(id,v){try{await updateDoc(doc(db,'forum_posts',id),{pinned:!v});showToast(v?'Відкріплено':'📌 Закріплено');loadForumMod();}catch(e){showToast('Помилка: '+e.message,'error');}};
window.toggleLock=async function(id,v){try{await updateDoc(doc(db,'forum_posts',id),{locked:!v});showToast(v?'🔓 Відкрито':'🔒 Закрито');loadForumMod();}catch(e){showToast('Помилка: '+e.message,'error');}};
window.deleteForumPost=async function(id){

// ── REPORTS ───────────────────────────────────────────────────
window.loadReports=async function(){
  const list=document.getElementById('reports-list');
  const sf=document.getElementById('report-status-filter')?.value||'open';
  list.innerHTML='<div class="loading-row">Завантаження...</div>';
  try{
    const q=sf==='all'
      ?query(collection(db,'support_tickets'),where('type','==','report'),orderBy('createdAt','desc'),limit(30))
      :query(collection(db,'support_tickets'),where('type','==','report'),where('status','==',sf),orderBy('createdAt','desc'),limit(30));
    const snap=await getDocs(q);
    if(snap.empty){list.innerHTML='<div class="loading-row">Скарг немає</div>';return;}
    list.innerHTML='<div style="display:flex;flex-direction:column;gap:6px">'+snap.docs.map(d=>{
      const t=d.data(),date=t.createdAt?.toDate?t.createdAt.toDate().toLocaleDateString('uk-UA'):'—';
      const sc=t.status==='resolved'?'#4aaa5a':t.status==='inprogress'?'#8eb0cc':'#e8bc38';
      return`<div style="background:var(--card);border:1px solid var(--border);padding:16px;display:flex;align-items:flex-start;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="font-size:13px;color:#fff;margin-bottom:4px">${t.subject||'Скарга'}</div>
          <div style="font-size:11px;color:var(--dim);margin-bottom:6px">Від: ${t.reporterNick||'—'} · На: <span style="color:#e88038">${t.reportedNick||'—'}</span> · ${date}</div>
          <div style="font-size:12px;color:var(--dim);line-height:1.6">${(t.description||'').slice(0,120)}${(t.description||'').length>120?'...':''}</div>
        </div>
        <div style="display:flex;flex-direction:column;gap:6px;flex-shrink:0">
          <span style="font-size:10px;color:${sc};border:1px solid ${sc}44;padding:4px 8px">${t.status||'—'}</span>
          <button class="tbl-btn" onclick="openTicket('${d.id}')">Відкрити</button>
          <button class="tbl-btn success" onclick="resolveReport('${d.id}')">✅ Вирішено</button>
        </div>
      </div>`;
    }).join('')+'</div>';
  }catch(e){list.innerHTML=`<div class="loading-row" style="color:#c07070">${e.message}</div>`;}
};

window.resolveReport=async function(id){
  try{await updateDoc(doc(db,'support_tickets',id),{status:'resolved',updatedAt:new Date()});await addDoc(collection(db,'moderation_log'),{action:'resolve_report',adminNick:currentAdmin?.nickname||'Адмін',target:id,createdAt:new Date()});showToast('✅ Вирішено');loadReports();}
  catch(e){showToast('Помилка: '+e.message,'error');}
};

// ── TICKETS ───────────────────────────────────────────────────
const TC={bug:'#e84040',report:'#e88038',idea:'#4aaa5a',payment:'#e8bc38',account:'#8eb0cc',other:'#a070cc'};
const TL={bug:'🐛 Баг',report:'🚨 Скарга',idea:'💡 Ідея',payment:'💳 Платіж',account:'👤 Акаунт',other:'📝 Інше'};

window.loadTickets=async function(){
  const list=document.getElementById('tickets-list');
  if(!list)return;
  const sf=document.getElementById('tickets-filter')?.value||'all';
  const tf=document.getElementById('tickets-type')?.value||'all';
  list.innerHTML='<div class="loading-row">Завантаження...</div>';
  try{
    const q=sf!=='all'?query(collection(db,'support_tickets'),where('status','==',sf),orderBy('createdAt','desc'),limit(50)):query(collection(db,'support_tickets'),orderBy('createdAt','desc'),limit(50));
    const snap=await getDocs(q);
    if(snap.empty){list.innerHTML='<div class="loading-row">Заявок немає</div>';return;}
    let tickets=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(tf!=='all')tickets=tickets.filter(t=>t.type===tf);
    list.innerHTML=`<table><thead><tr><th>ID</th><th>Тип</th><th>Гравець</th><th>Тема</th><th>Пріор.</th><th>Дата</th><th>Статус</th><th>Дія</th></tr></thead><tbody>`+
    tickets.map(t=>{
      const c=TC[t.type]||'#888',date=t.createdAt?.toDate?t.createdAt.toDate().toLocaleDateString('uk-UA'):'—';
      const prio=t.priority==='high'?'🔴':t.priority==='medium'?'🟡':'🟢';
      const sc=t.status==='resolved'?'#4aaa5a':t.status==='inprogress'?'#8eb0cc':t.status==='closed'?'#6a7a8a':'#e8bc38';
      return`<tr><td style="font-family:var(--px);font-size:9px;color:var(--dim)">${t.ticketId||t.id.slice(0,8)}</td>
        <td><span style="font-size:10px;color:${c}">${TL[t.type]||t.type}</span></td>
        <td>${t.reporterNick||'—'}</td>
        <td style="font-size:12px;max-width:140px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis">${t.subject||'—'}</td>
        <td>${prio}</td><td style="font-size:11px;color:var(--dim)">${date}</td>
        <td><span style="font-size:10px;color:${sc}">${t.status||'—'}</span></td>
        <td><button class="tbl-btn" onclick="openTicket('${t.id}')">Відкрити</button></td></tr>`;
    }).join('')+'</tbody></table>';
  }catch(e){list.innerHTML=`<div class="loading-row" style="color:#c07070">${e.message}</div>`;}
};

window.openTicket=async function(docId){
  try{
    const snap=await getDoc(doc(db,'support_tickets',docId));
    if(!snap.exists())return;
    const t=snap.data(),date=t.createdAt?.toDate?t.createdAt.toDate().toLocaleString('uk-UA'):'—',c=TC[t.type]||'#888';
    document.getElementById('tm-id').textContent=t.ticketId||docId;
    document.getElementById('tm-body').innerHTML=`
      <div style="display:flex;gap:10px;flex-wrap:wrap;margin-bottom:20px">
        <span style="font-size:11px;color:${c};border:1px solid ${c}44;padding:4px 10px">${TL[t.type]||t.type}</span>
        <span style="font-size:11px;color:var(--dim)">📅 ${date}</span>
        <span style="font-size:11px;color:var(--dim)">${t.priority==='high'?'🔴 Критичний':t.priority==='medium'?'🟡 Середній':'🟢 Низький'}</span>
      </div>
      <div style="font-size:16px;color:#fff;margin-bottom:8px">${t.subject||'—'}</div>
      <div style="font-size:13px;color:var(--dim);margin-bottom:4px">Від: <span style="color:#fff">${t.reporterNick||'—'}</span>${t.reporterEmail?` · <a href="mailto:${t.reporterEmail}" style="color:var(--gold)">${t.reporterEmail}</a>`:''}${t.reportedNick?` · На: <span style="color:#e88038">${t.reportedNick}</span>`:''}</div>
      <div style="margin:16px 0;padding:16px;background:var(--surf);border:1px solid var(--border);font-size:13px;line-height:1.8;white-space:pre-wrap">${t.description||'—'}</div>
      ${t.screenshotUrl?`<div style="margin-bottom:16px"><img src="${t.screenshotUrl}" style="max-width:100%;border:1px solid var(--border)"><br><a href="${t.screenshotUrl}" target="_blank" style="font-size:11px;color:var(--gold)">→ Повний розмір</a></div>`:''}
      ${t.adminReply?`<div style="margin-bottom:16px;padding:12px;background:rgba(74,170,90,0.08);border:1px solid rgba(74,170,90,0.3);font-size:13px"><span style="font-size:10px;color:#4aaa5a;font-family:var(--px)">ВІДПОВІДЬ АДМІНА</span><br><div style="margin-top:8px">${t.adminReply}</div></div>`:''}
      <div style="margin-bottom:12px"><label style="font-size:11px;color:var(--dim);display:block;margin-bottom:6px">Відповідь гравцю</label><textarea id="tm-reply" style="width:100%;padding:10px;background:var(--surf);border:1px solid var(--border);color:var(--text);font-size:13px;resize:vertical;min-height:60px;outline:none" placeholder="Напиши відповідь...">${t.adminReply||''}</textarea></div>
      <div style="margin-bottom:16px"><label style="font-size:11px;color:var(--dim);display:block;margin-bottom:6px">Статус</label>
        <select id="tm-status" class="admin-input" style="width:200px">
          <option value="open" ${t.status==='open'?'selected':''}>🟡 Відкрита</option>
          <option value="inprogress" ${t.status==='inprogress'?'selected':''}>🔵 В роботі</option>
          <option value="resolved" ${t.status==='resolved'?'selected':''}>✅ Вирішено</option>
          <option value="closed" ${t.status==='closed'?'selected':''}>⬜ Закрита</option>
        </select></div>
      <div style="display:flex;gap:10px">
        <button class="admin-btn" onclick="updateTicketStatus('${docId}')">💾 Зберегти</button>
        <button class="admin-btn secondary" onclick="closeTicketModal()">Закрити</button>
      </div>`;
    document.getElementById('ticket-modal').style.display='flex';
    document.body.style.overflow='hidden';
  }catch(e){showToast('Помилка: '+e.message,'error');}
};

window.updateTicketStatus=async function(docId){
  const status=document.getElementById('tm-status').value;
  const reply=document.getElementById('tm-reply')?.value.trim();
  try{
    const upd={status,updatedAt:new Date(),adminNick:currentAdmin?.nickname};
    if(reply)upd.adminReply=reply;
    await updateDoc(doc(db,'support_tickets',docId),upd);
    await addDoc(collection(db,'moderation_log'),{action:'ticket_'+status,adminNick:currentAdmin?.nickname||'Адмін',target:docId,createdAt:new Date()});
    showToast('✅ Оновлено');closeTicketModal();loadTickets();
  }catch(e){showToast('Помилка: '+e.message,'error');}
};
window.closeTicketModal=function(){document.getElementById('ticket-modal').style.display='none';document.body.style.overflow='';};

window.sendAnnouncement=async function(){
  const title=document.getElementById('ann-title').value.trim();
  const text=document.getElementById('ann-text').value.trim();
  if(!title||!text){showToast('Заповни заголовок і текст','error');return;}
  try{
    await addDoc(collection(db,'announcements'),{title,text,type:document.getElementById('ann-type').value,target:document.getElementById('ann-target').value,pinned:document.getElementById('ann-pin').checked,authorNick:currentAdmin?.nickname||'Адмін',authorUid:currentAdmin?.uid,createdAt:new Date()});

        <button class="tbl-btn danger" onclick="deleteAnn('${d.id}')">🗑️</button></div>`;
    }).join('');
  }catch(e){}
}
window.deleteAnn=async function(id){if(!confirm('Видалити?'))return;try{await deleteDoc(doc(db,'announcements',id));loadAnnHistory();}catch(e){}};

// ── ANALYTICS ─────────────────────────────────────────────────
window.loadAnalytics=async function(){
  try{
    const today=new Date().toISOString().slice(0,10);
    const dauS=await getDoc(doc(db,'siteStats','daily_'+today));
    setText('an-dau',dauS.exists()?(dauS.data().uniqueToday||0).toLocaleString():'0');

    const days7=[];
    for(let i=6;i>=0;i--){const d=new Date();d.setDate(d.getDate()-i);days7.push(d.toISOString().slice(0,10));}
    const v7=await Promise.all(days7.map(d=>getDoc(doc(db,'siteStats','daily_'+d))));
    const vals=v7.map(s=>s.exists()?(s.data().visits||0):0);
    const mx=Math.max(...vals,1);
    setText('an-wau',vals.reduce((a,b)=>a+b,0).toLocaleString());

    const chartEl=document.getElementById('visits-chart');
    const labelsEl=document.getElementById('visits-labels');
    if(chartEl) chartEl.innerHTML=vals.map((v,i)=>`<div class="mini-bar" title="${days7[i]}: ${v}" style="height:${Math.round(v/mx*56)+4}px;flex:1"></div>`).join('');
    if(labelsEl) labelsEl.innerHTML=days7.map(d=>`<div style="flex:1;font-size:9px;color:var(--dim);text-align:center">${d.slice(5)}</div>`).join('');

    try{const tp=await getDocs(query(collection(db,'players'),orderBy('rating','desc'),limit(5)));
      document.getElementById('an-top-players').innerHTML=tp.docs.map((d,i)=>{const p=d.data();return`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(26,48,80,.3);font-size:12px"><span style="color:${i===0?'var(--gold)':i===1?'#c0c0c0':i===2?'#cd7f32':'var(--text)'}">${['🥇','🥈','🥉','4.','5.'][i]} ${p.nickname||'—'}</span><span style="color:var(--gold);font-family:var(--px);font-size:10px">${(p.rating||0).toLocaleString()}</span></div>`;}).join('');}catch(e){}
    try{const tc=await getDocs(query(collection(db,'clans'),orderBy('rating','desc'),limit(5)));
      document.getElementById('an-top-clans').innerHTML=tc.docs.map((d,i)=>{const c=d.data();return`<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid rgba(26,48,80,.3);font-size:12px"><span>[${c.tag||'??'}] ${c.name||'—'}</span><span style="color:var(--gold);font-family:var(--px);font-size:10px">★ ${(c.rating||0).toLocaleString()}</span></div>`;}).join('');}catch(e){}

    const fS=await getDocs(collection(db,'forum_posts'));
    setText('an-forum',fS.size.toLocaleString());
    setText('an-new-players','—');
  }catch(e){console.error('Analytics:',e);}
};

// ── TOURNAMENTS ───────────────────────────────────────────────
let editingTournId=null;

window.loadTournamentsAdmin=async function(){
  const list=document.getElementById('tournaments-admin-list');if(!list)return;
  list.innerHTML='<div class="loading-row">Завантаження...</div>';
  try{
    const snap=await getDocs(query(collection(db,'tournaments'),orderBy('createdAt','desc'),limit(20)));
    if(snap.empty){list.innerHTML='<div class="loading-row">Турнірів немає. Натисни "+ Новий"</div>';return;}
    const S={upcoming:'⏳ Незабаром',registration:'📝 Реєстрація',active:'🟢 Активний',finished:'✅ Завершено'};
    const SC={upcoming:'var(--dim)',registration:'#4aaa5a',active:'var(--gold)',finished:'var(--steel)'};
    list.innerHTML=snap.docs.map(d=>{
      const t=d.data();
      return`<div style="background:var(--card);border:1px solid var(--border);padding:16px;margin-bottom:8px;display:flex;align-items:center;gap:14px;flex-wrap:wrap">
        <div style="flex:1;min-width:200px">
          <div style="font-size:14px;color:#fff;margin-bottom:4px">${t.name||'—'}</div>
          <div style="font-size:11px;color:var(--dim)">${t.date||'—'} · ${t.format||'—'} · 🏆 ${(t.prize||0).toLocaleString()} ⭐</div>
        </div>
        <span style="font-size:10px;color:${SC[t.status]||'var(--dim)'};border:1px solid ${SC[t.status]||'var(--border)'}44;padding:4px 8px">${S[t.status]||t.status}</span>
        <div style="display:flex;gap:6px">
          <button class="tbl-btn" onclick="openTournamentEditor('${d.id}')">✏️ Редагувати</button>
          <button class="tbl-btn danger" onclick="deleteTournament('${d.id}')">🗑️</button>
        </div></div>`;
    }).join('');
  }catch(e){list.innerHTML=`<div class="loading-row" style="color:#c07070">${e.message}</div>`;}
};

window.openTournamentEditor=function(id){
  editingTournId=id;
  document.getElementById('tourn-modal-title').textContent=id?'Редагувати турнір':'Новий турнір';
  ['name','format','desc'].forEach(f=>{const el=document.getElementById('tourn-'+f);if(el)el.value='';});
  document.getElementById('tourn-maxp').value='32';
  document.getElementById('tourn-prize').value='0';
  document.getElementById('tourn-status').value='upcoming';
  document.getElementById('tourn-msg').style.display='none';
  if(id){getDoc(doc(db,'tournaments',id)).then(snap=>{if(!snap.exists())return;const t=snap.data();document.getElementById('tourn-name').value=t.name||'';document.getElementById('tourn-format').value=t.format||'';document.getElementById('tourn-maxp').value=t.maxParticipants||32;document.getElementById('tourn-prize').value=t.prize||0;document.getElementById('tourn-desc').value=t.description||'';document.getElementById('tourn-status').value=t.status||'upcoming';if(t.date)document.getElementById('tourn-date').value=t.date;});}
  document.getElementById('tournament-modal').style.display='flex';document.body.style.overflow='hidden';
};
window.closeTournamentEditor=function(){document.getElementById('tournament-modal').style.display='none';document.body.style.overflow='';editingTournId=null;};

window.saveTournament=async function(){
  const name=document.getElementById('tourn-name').value.trim();
  const msgEl=document.getElementById('tourn-msg');
  if(!name){showMsg(msgEl,'Введи назву','err');return;}
  const data={name,format:document.getElementById('tourn-format').value.trim(),maxParticipants:parseInt(document.getElementById('tourn-maxp').value)||32,prize:parseInt(document.getElementById('tourn-prize').value)||0,description:document.getElementById('tourn-desc').value.trim(),status:document.getElementById('tourn-status').value,date:document.getElementById('tourn-date').value,updatedAt:new Date()};
  try{
    if(editingTournId){await updateDoc(doc(db,'tournaments',editingTournId),data);}
    else{data.createdAt=new Date();data.createdBy=currentAdmin?.uid;await addDoc(collection(db,'tournaments'),data);}
    showMsg(msgEl,'✅ Збережено!','ok');
    setTimeout(()=>{closeTournamentEditor();loadTournamentsAdmin();},800);
  }catch(e){showMsg(msgEl,'Помилка: '+e.message,'err');}
};
window.deleteTournament=async function(id){if(!confirm('Видалити?'))return;try{await deleteDoc(doc(db,'tournaments',id));showToast('✅ Видалено');loadTournamentsAdmin();}catch(e){showToast('Помилка: '+e.message,'error');}};

// ── PROMOCODES ────────────────────────────────────────────────
window.loadPromocodes=async function(){
  const list=document.getElementById('promo-list');if(!list)return;
  list.innerHTML='<tr><td colspan="6" class="loading-row">Завантаження...</td></tr>';
  try{
    const snap=await getDocs(query(collection(db,'promocodes'),orderBy('createdAt','desc')));
    if(snap.empty){list.innerHTML='<tr><td colspan="6" class="loading-row">Промокодів немає</td></tr>';return;}
    list.innerHTML=snap.docs.map(d=>{
      const p=d.data(),exp=p.expiresAt?.toDate?p.expiresAt.toDate().toLocaleDateString('uk-UA'):'—';

window.openTankEditor=async function(tankId){
  editingTankId=tankId;
  document.getElementById('te-title').textContent=tankId?'Редагувати танк':'Новий танк';
  document.getElementById('te-msg').style.display='none';
  ['id','name','emoji','nation','desc','role'].forEach(f=>{const el=document.getElementById('te-'+f);if(el)el.value='';});
  ['hp','damage','armor','speed','view','masking'].forEach(f=>{const el=document.getElementById('te-'+f);if(el)el.value='50';});
  document.getElementById('te-soon').checked=false;
  document.getElementById('te-img-preview').style.display='none';
  document.getElementById('te-img-url').value='';

  // Будуємо поля особливостей через JS (виправляє баг з template literal в HTML)
  const pw=document.getElementById('te-perks-wrap');
  pw.innerHTML='';
  for(let i=0;i<3;i++){
    const row=document.createElement('div');
    row.style.cssText='display:grid;grid-template-columns:50px 1fr 2fr;gap:8px;margin-bottom:8px;align-items:center';
    ['icon','name','desc'].forEach((f,fi)=>{
      const inp=document.createElement('input');
      inp.className='admin-input';inp.id=`te-perk${i}-${f}`;
      inp.placeholder=['⭐','Назва','Опис'][fi];inp.style.width='100%';
      if(f==='icon'){inp.maxLength=4;inp.style.textAlign='center';}
      row.appendChild(inp);
    });
    pw.appendChild(row);
  }

  if(tankId){
    try{
      const snap=await getDoc(doc(db,'tanks_db',tankId));
      if(snap.exists()){
        const t=snap.data();
        document.getElementById('te-id').value=tankId;document.getElementById('te-id').disabled=true;
        document.getElementById('te-name').value=t.name||'';document.getElementById('te-emoji').value=t.emoji||'';
        document.getElementById('te-nation').value=t.nation||'';document.getElementById('te-faction').value=t.faction||'west';
        document.getElementById('te-class').value=t.tankClass||'medium';document.getElementById('te-tier').value=t.tier||1;
        document.getElementById('te-soon').checked=!!t.comingSoon;document.getElementById('te-desc').value=t.desc||'';document.getElementById('te-role').value=t.role||'';
        if(t.imageUrl){document.getElementById('te-img-url').value=t.imageUrl;const prev=document.getElementById('te-img-preview');prev.src=t.imageUrl;prev.style.display='block';}
        const s=t.stats||{};['hp','damage','armor','speed','view','masking'].forEach(f=>{const el=document.getElementById('te-'+f);if(el)el.value=s[f]||50;});
        (t.perks||[]).forEach((p,i)=>{if(i>2)return;['icon','name','desc'].forEach(f=>{const el=document.getElementById(`te-perk${i}-${f}`);if(el)el.value=p[f]||'';});});
      }
    }catch(e){console.error(e);}
  }else{document.getElementById('te-id').disabled=false;}
  document.getElementById('tank-editor-modal').style.display='flex';document.body.style.overflow='hidden';
};

window.closeTankEditor=function(){document.getElementById('tank-editor-modal').style.display='none';document.body.style.overflow='';editingTankId=null;};
window.previewTankImg=function(url){const prev=document.getElementById('te-img-preview');if(url){prev.src=url;prev.style.display='block';}else prev.style.display='none';};

window.uploadTankImg=async function(input){
  const file=input.files[0];if(!file)return;
  if(file.size>5*1024*1024){showToast('Макс 5MB','error');return;}
  const msgEl=document.getElementById('te-msg');showMsg(msgEl,'⏳ Завантаження...','ok');
  try{
    const {getStorage,ref,uploadBytesResumable,getDownloadURL}=await import('https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js');
    const storage=getStorage();const tankId=document.getElementById('te-id').value.trim()||'tank_'+Date.now();
    const sRef=ref(storage,`tanks/${tankId}_${file.name}`);
    const task=uploadBytesResumable(sRef,file);
    const url=await new Promise((res,rej)=>task.on('state_changed',null,rej,async()=>res(await getDownloadURL(task.snapshot.ref))));
    document.getElementById('te-img-url').value=url;const prev=document.getElementById('te-img-preview');prev.src=url;prev.style.display='block';
    showMsg(msgEl,'✅ Завантажено!','ok');
  }catch(e){showMsg(msgEl,'Помилка: '+e.message,'err');}
};

  try{
    await updateDoc(doc(db,'streamer_applications',docId),{status:tier,updatedAt:new Date()});
    if(uid&&tier!=='pending'&&tier!=='rejected'){const pSnap=await getDoc(doc(db,'players',uid));if(pSnap.exists()){const pd=pSnap.data();const code=pd.streamerCode||('STREAM_'+(pd.nickname||'').toUpperCase().slice(0,8));await updateDoc(doc(db,'players',uid),{streamerStatus:tier,streamerCode:code,streamerApprovedAt:new Date()});}}
    else if(uid&&tier==='rejected'){await updateDoc(doc(db,'players',uid),{streamerStatus:'none'});}
    await addDoc(collection(db,'moderation_log'),{action:'streamer_'+tier,adminNick:currentAdmin?.nickname||'Адмін',target:uid,details:TIER_LABELS[tier]||tier,createdAt:new Date()});
    showToast('✅ Оновлено');closeStreamerModal();loadStreamers();
  }catch(e){showToast('Помилка: '+e.message,'error');}
};
window.closeStreamerModal=function(){document.getElementById('streamer-modal').style.display='none';document.body.style.overflow='';};

// ── LOGS ──────────────────────────────────────────────────────
window.loadLogs=async function(){
  const list=document.getElementById('logs-list');if(!list)return;
  const fv=document.getElementById('log-action-filter')?.value||'all';
  try{
    const q=fv==='all'?query(collection(db,'moderation_log'),orderBy('createdAt','desc'),limit(50)):query(collection(db,'moderation_log'),where('action','>=',fv),where('action','<=',fv+'\uf8ff'),orderBy('action'),limit(50));
    const snap=await getDocs(q);
    if(snap.empty){list.innerHTML='<div class="loading-row">Логів немає</div>';return;}
    const ac=a=>a.includes('ban')?'#c07070':a.includes('give')?'#4aaa5a':a.includes('forum')?'#a070cc':'var(--gold)';
    list.innerHTML='<table><thead><tr><th>Час</th><th>Адмін</th><th>Дія</th><th>Ціль</th><th>Деталі</th></tr></thead><tbody>'+
    snap.docs.map(d=>{const l=d.data(),t=l.createdAt?.toDate?l.createdAt.toDate().toLocaleString('uk-UA'):'—';
      return`<tr><td style="font-size:11px;color:var(--dim)">${t}</td><td style="font-size:12px">${l.adminNick||'—'}</td><td style="color:${ac(l.action||'')};font-size:11px">${l.action||'—'}</td><td style="font-size:12px">${l.targetNick||l.target||'—'}</td><td style="font-size:11px;color:var(--dim)">${l.details||l.reason||'—'}</td></tr>`;
    }).join('')+'</tbody></table>';
  }catch(e){list.innerHTML='<div class="loading-row" style="color:#c07070">'+e.message+'</div>';}
};

// ── HELPERS ───────────────────────────────────────────────────
function setText(id,val){const el=document.getElementById(id);if(el)el.textContent=val;}
function showToast(msg,type=''){const t=document.getElementById('toast');t.textContent=msg;t.className='show'+(type?' '+type:'');setTimeout(()=>t.className='',3000);}
function showMsg(el,text,type){el.textContent=text;el.style.display='block';el.style.cssText+=type==='ok'?';color:#4aaa5a;background:rgba(30,80,30,0.2);border-color:#4aaa5a':';color:#c07070;background:rgba(120,30,30,0.15);border-color:#aa2020';}
window.showToast=showToast;
window.adminSignOut=()=>signOut(auth).then(()=>window.location.href='profile.html');

window.showSection=function(name){
  document.querySelectorAll('.admin-section').forEach(s=>s.classList.remove('active'));
  document.querySelectorAll('.sidebar-item').forEach(s=>s.classList.remove('active'));
  const el=document.getElementById('section-'+name);if(el)el.classList.add('active');
  const btn=document.querySelector(`.sidebar-item[data-section="${name}"]`);if(btn)btn.classList.add('active');
  if(name==='logs')loadLogs();
  if(name==='bans')loadBans();
  if(name==='announce')loadAnnHistory();
  if(name==='analytics')loadAnalytics();
};

setTimeout(loadAnnHistory,2000);
</script>
